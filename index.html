<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTTAM PHOTOGRAPHY</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    overflow-x:hidden;

    background:
    linear-gradient(
        rgba(0,0,0,.38),
        rgba(0,0,0,.78)
    ),
    url("background.png");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}


/* =========================
   BACKGROUND EFFECT
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(
        circle at center,
        rgba(255,190,80,.12),
        transparent 45%
    );

    pointer-events:none;
}


/* =========================
   TOP BAR
========================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;

    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:22px 30px;
}


.time{
    font-size:24px;
    font-weight:bold;

    text-shadow:
    0 2px 12px black;
}


.date{
    margin-top:5px;

    font-size:11px;
    letter-spacing:2px;

    opacity:.75;
}


.all-songs{
    border:1px solid rgba(255,255,255,.3);

    background:rgba(0,0,0,.45);

    color:white;

    padding:11px 20px;

    border-radius:30px;

    cursor:pointer;

    font-weight:bold;

    backdrop-filter:blur(10px);

    transition:.3s;
}


.all-songs:hover{
    background:rgba(255,255,255,.18);

    transform:scale(1.05);
}


/* =========================
   MAIN
========================= */

.main{
    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:
    100px 20px 180px;
}


.content{
    width:100%;

    max-width:900px;
}


/* LOGO */

.logo{
    width:90px;
    height:90px;

    margin:auto;

    display:flex;

    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:
    linear-gradient(
        145deg,
        #222,
        #050505
    );

    border:3px solid #e7b94e;

    box-shadow:
    0 0 0 6px rgba(0,0,0,.35),
    0 0 35px rgba(255,190,70,.25);

    font-size:35px;

    animation:logoFloat 3s ease-in-out infinite;
}


@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

}


/* TAG */

.tag{
    display:inline-block;

    margin-top:25px;

    padding:9px 20px;

    border-radius:30px;

    border:
    1px solid
    rgba(255,255,255,.25);

    background:
    rgba(0,0,0,.35);

    font-size:11px;

    letter-spacing:2px;

    backdrop-filter:blur(8px);
}


/* TITLE */

h1{

    margin-top:25px;

    font-family:
    Georgia,
    "Times New Roman",
    serif;

    font-size:
    clamp(48px,9vw,105px);

    line-height:.9;

    letter-spacing:-3px;

    text-shadow:
    0 6px 25px black;

}


/* GOLD TITLE EFFECT */

.title-gold{

    background:
    linear-gradient(
        90deg,
        #fff,
        #f0c45b,
        #fff,
        #d9a62e,
        #fff
    );

    background-size:300%;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:
    titleShine 5s linear infinite;
}


@keyframes titleShine{

    0%{
        background-position:0%;
    }

    100%{
        background-position:300%;
    }

}


.subtitle{

    margin-top:18px;

    font-size:13px;

    letter-spacing:5px;

    opacity:.8;
}


/* =========================
   DYNAMIC PLAYER
========================= */

.player{

    position:fixed;

    left:50%;

    bottom:20px;

    transform:
    translateX(-50%);

    z-index:50;

    width:
    min(
        780px,
        calc(100% - 25px)
    );

    padding:15px 17px;

    border-radius:28px;

    background:
    rgba(15,12,10,.88);

    border:
    1px solid
    rgba(255,255,255,.18);

    box-shadow:
    0 15px 50px
    rgba(0,0,0,.7);

    backdrop-filter:
    blur(18px);

    transition:.3s;
}


/* PLAYING EFFECT */

.player.playing{

    box-shadow:

    0 15px 50px
    rgba(0,0,0,.7),

    0 0 30px
    rgba(255,190,70,.20);

    animation:
    playerGlow 2s ease-in-out infinite alternate;
}


@keyframes playerGlow{

    from{
        transform:
        translateX(-50%)
        scale(1);
    }

    to{
        transform:
        translateX(-50%)
        scale(1.012);
    }

}


.player-row{

    display:flex;

    align-items:center;

    gap:12px;
}


/* PLAY BUTTON */

.play{

    width:50px;
    height:50px;

    flex-shrink:0;

    border:0;

    border-radius:50%;

    background:white;

    color:#111;

    cursor:pointer;

    font-size:18px;

    font-weight:bold;

    transition:.3s;
}


.play:hover{

    transform:scale(1.1);

}


.player.playing .play{

    animation:
    playPulse 1.2s infinite;
}


@keyframes playPulse{

    0%,100%{
        box-shadow:
        0 0 0 0
        rgba(255,255,255,.3);
    }

    50%{
        box-shadow:
        0 0 0 12px
        rgba(255,255,255,0);
    }

}


/* SONG INFO */

.song-info{

    flex:1;

    min-width:0;
}


.now-playing{

    font-size:9px;

    letter-spacing:2px;

    opacity:.55;
}


.song-title{

    margin-top:4px;

    font-size:15px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.player.playing .song-title{

    animation:
    songGlow 1.5s
    ease-in-out
    infinite alternate;
}


@keyframes songGlow{

    from{
        opacity:.65;
    }

    to{
        opacity:1;
    }

}


/* NEXT PREVIOUS */

.control{

    border:0;

    background:transparent;

    color:white;

    font-size:32px;

    cursor:pointer;

    padding:5px 8px;

    transition:.2s;
}


.control:hover{

    transform:scale(1.2);

}


/* PROGRESS */

.progress{

    width:100%;

    height:5px;

    margin-top:11px;

    appearance:none;

    border-radius:10px;

    background:
    rgba(255,255,255,.16);

    cursor:pointer;
}


.progress::-webkit-slider-thumb{

    appearance:none;

    width:12px;
    height:12px;

    border-radius:50%;

    background:white;

}


/* =========================
   SONG LIST
========================= */

.song-list{

    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    overflow:auto;

    padding:
    80px 20px 140px;

    background:
    rgba(8,7,6,.97);
}


.song-list.show{

    display:block;

}


.song-box{

    width:
    min(850px,100%);

    margin:auto;
}


.song-box h2{

    font-size:32px;

    margin-bottom:20px;
}


.close{

    float:right;

    border:
    1px solid
    rgba(255,255,255,.4);

    background:transparent;

    color:white;

    padding:8px 16px;

    border-radius:20px;

    cursor:pointer;
}


.song{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    padding:14px 16px;

    margin:8px 0;

    border-radius:15px;

    background:
    rgba(255,255,255,.07);

    border:
    1px solid
    rgba(255,255,255,.07);

    transition:.2s;
}


.song:hover{

    background:
    rgba(255,255,255,.13);

}


.song.active{

    background:
    rgba(255,255,255,.20);

    box-shadow:
    inset 3px 0
    #e7b94e;
}


.song-name{

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


.song button{

    border:0;

    padding:9px 16px;

    border-radius:20px;

    cursor:pointer;

    font-weight:bold;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .topbar{

        padding:
        14px;

    }

    .time{

        font-size:18px;

    }

    .date{

        font-size:8px;

        letter-spacing:1px;

    }

    .all-songs{

        padding:
        8px 12px;

        font-size:11px;

    }

    .logo{

        width:72px;

        height:72px;

        font-size:28px;

    }

    h1{

        font-size:
        55px;

        letter-spacing:-2px;

    }

    .subtitle{

        font-size:9px;

        letter-spacing:3px;

    }

    .player{

        bottom:8px;

        border-radius:20px;

        padding:11px;

    }

    .play{

        width:43px;

        height:43px;

    }

    .song-title{

        font-size:13px;

    }

}


/* =========================
   HIDE AUDIO
========================= */

audio{

    display:none;

}

</style>

</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">

    <div>

        <div
        class="time"
        id="time">

        00:00:00

        </div>

        <div
        class="date"
        id="date">

        </div>

    </div>


    <button
    class="all-songs"
    onclick="openSongs()">

        🎵 ALL SONGS

    </button>

</div>



<!-- =========================
     MAIN
========================= -->

<main class="main">

    <div class="content">


        <div class="logo">

            ▶

        </div>


        <div class="tag">

            🎵 NOW PLAYING • UTTAM MUSIC

        </div>


        <h1 class="title-gold">

            UTTAM<br>

            PHOTOGRAPHY

        </h1>


        <div class="subtitle">

            YOUR PERSONAL MUSIC STATION

        </div>


    </div>

</main>



<!-- =========================
     MUSIC PLAYER
========================= -->

<div
class="player"
id="player">


    <div class="player-row">


        <button
        class="play"
        id="playButton"
        onclick="playPause()">

            ▶

        </button>


        <div class="song-info">


            <div class="now-playing">

                NOW PLAYING

            </div>


            <div
            class="song-title"
            id="songTitle">

                Song 1

            </div>


        </div>


        <button
        class="control"
        onclick="previousSong()">

            ‹

        </button>


        <button
        class="control"
        onclick="nextSong()">

            ›

        </button>


    </div>


    <input
    type="range"
    class="progress"
    id="progress"
    min="0"
    max="100"
    value="0">


    <audio
    id="audio"
    preload="metadata">
    </audio>


</div>



<!-- =========================
     SONG LIST
========================= -->

<div
class="song-list"
id="songList">


    <div class="song-box">


        <button
        class="close"
        onclick="closeSongs()">

            ✕ CLOSE

        </button>


        <h2>

            🎵 MY SONGS

        </h2>


        <div id="songs">

        </div>


    </div>

</div>



<script>


/* =========================
   SONG DATABASE
========================= */


const songs = [];


for(
    let i = 1;
    i <= 35;
    i++
){

    songs.push({

        name:
        "Song " + i,

        file:
        "song (" + i + ").mp3"

    });

}



/* =========================
   PLAYER VARIABLES
========================= */


let currentSong = 0;


const audio =
document.getElementById(
    "audio"
);


const player =
document.getElementById(
    "player"
);


const playButton =
document.getElementById(
    "playButton"
);


const songTitle =
document.getElementById(
    "songTitle"
);


const progress =
document.getElementById(
    "progress"
);



/* =========================
   LOAD SONG
========================= */


function loadSong(
    index,
    autoPlay = false
){

    currentSong = index;


    if(
        currentSong < 0
    ){

        currentSong =
        songs.length - 1;

    }


    if(
        currentSong >= songs.length
    ){

        currentSong = 0;

    }


    audio.src =
    songs[currentSong].file;


    songTitle.innerText =
    "🎵 " +
    songs[currentSong].name;


    progress.value = 0;


    updateSongList();


    if(autoPlay){

        audio.play()
        .catch(
            () => {}
        );

    }

}



/* =========================
   PLAY / PAUSE
========================= */


function playPause(){

    if(
        audio.paused
    ){

        audio.play()
        .catch(
            () => {}
        );

    }

    else{

        audio.pause();

    }

}



/* =========================
   PLAY EVENT
========================= */


audio.addEventListener(
    "play",
    function(){

        playButton.innerText =
        "❚❚";

        player.classList.add(
            "playing"
        );

    }
);



/* =========================
   PAUSE EVENT
========================= */


audio.addEventListener(
    "pause",
    function(){

        playButton.innerText =
        "▶";

        player.classList.remove(
            "playing"
        );

    }
);



/* =========================
   AUTOMATIC NEXT SONG
========================= */


audio.addEventListener(
    "ended",
    function(){

        nextSong();

    }
);



/* =========================
   NEXT SONG
========================= */


function nextSong(){

    currentSong++;

    if(
        currentSong >= songs.length
    ){

        currentSong = 0;

    }

    loadSong(
        currentSong,
        true
    );

}



/* =========================
   PREVIOUS SONG
========================= */


function previousSong(){

    currentSong--;

    if(
        currentSong < 0
    ){

        currentSong =
        songs.length - 1;

    }

    loadSong(
        currentSong,
        true
    );

}



/* =========================
   PROGRESS BAR
========================= */


audio.addEventListener(
    "timeupdate",
    function(){

        if(
            audio.duration
        ){

            progress.value =
            (
                audio.currentTime /
                audio.duration
            ) * 100;

        }

    }
);



progress.addEventListener(
    "input",
    function(){

        if(
            audio.duration
        ){

            audio.currentTime =
            (
                progress.value /
                100
            ) *
            audio.duration;

        }

    }
);



/* =========================
   CREATE SONG LIST
========================= */


function createSongList(){

    const list =
    document.getElementById(
        "songs"
    );


    list.innerHTML = "";


    songs.forEach(
        function(song,index){

            const item =
            document.createElement(
                "div"
            );


            item.className =
            "song";


            item.innerHTML = `

                <span class="song-name">

                    🎵 ${song.name}

                </span>


                <button
                onclick="
                playSelectedSong(
                    ${index}
                )">

                    ▶ PLAY

                </button>

            `;


            list.appendChild(
                item
            );

        }
    );

}



/* =========================
   SELECT SONG
========================= */


function playSelectedSong(
    index
){

    loadSong(
        index,
        true
    );

}



/* =========================
   UPDATE LIST
========================= */


function updateSongList(){

    const items =
    document.querySelectorAll(
        ".song"
    );


    items.forEach(
        function(item,index){

            if(
                index === currentSong
            ){

                item.classList.add(
                    "active"
                );

            }

            else{

                item.classList.remove(
                    "active"
                );

            }

        }
    );

}



/* =========================
   OPEN SONG LIST
========================= */


function openSongs(){

    document
    .getElementById(
        "songList"
    )
    .classList.add(
        "show"
    );


    updateSongList();

}



/* =========================
   CLOSE SONG LIST
========================= */


function closeSongs(){

    document
    .getElementById(
        "songList"
    )
    .classList.remove(
        "show"
    );

}



/* =========================
   LIVE TIME
========================= */


function updateTime(){

    const now =
    new Date();


    document
    .getElementById(
        "time"
    )
    .innerText =
    now.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );


    document
    .getElementById(
        "date"
    )
    .innerText =
    now.toLocaleDateString(
        "en-IN",
        {
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    ).toUpperCase();

}



/* =========================
   START WEBSITE
========================= */


createSongList();


loadSong(
    0,
    false
);


updateTime();


setInterval(
    updateTime,
    1000
);


</script>


</body>
</html>
