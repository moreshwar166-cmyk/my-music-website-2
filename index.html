<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTTAM PHOTOGRAPHY - MY MUSIC</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    font-family:Arial, Helvetica, sans-serif;

    color:white;

    background-color:#090909;

    background-image:
        linear-gradient(
            rgba(0,0,0,.48),
            rgba(0,0,0,.68)
        ),
        url("background.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    overflow-x:hidden;
}


/* =========================
   TOP
========================= */

.top{

    width:100%;

    padding:22px 30px;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:20px;
}


.clock{

    font-size:25px;

    font-weight:bold;

    letter-spacing:1px;
}


.date{

    margin-top:5px;

    font-size:11px;

    letter-spacing:2px;

    opacity:.75;
}


.topButtons{

    display:flex;

    gap:10px;

    align-items:center;
}


.topBtn{

    border:1px solid rgba(255,255,255,.30);

    background:rgba(0,0,0,.40);

    color:white;

    padding:11px 16px;

    border-radius:25px;

    cursor:pointer;

    font-size:12px;

    font-weight:bold;

    backdrop-filter:blur(12px);

    transition:.2s;
}


.topBtn:hover{

    background:rgba(255,255,255,.18);

    transform:translateY(-2px);
}


/* SPECIAL BUTTON */

.specialBtn{

    background:linear-gradient(
        135deg,
        #7c3aed,
        #ec4899
    );

    border:none;
}


/* =========================
   MAIN
========================= */

.main{

    min-height:calc(100vh - 100px);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:30px 20px 180px;
}


.badge{

    padding:10px 25px;

    border:1px solid rgba(255,255,255,.30);

    border-radius:30px;

    background:rgba(0,0,0,.25);

    backdrop-filter:blur(10px);

    font-size:11px;

    letter-spacing:4px;

    margin-bottom:30px;
}


h1{

    font-family:Georgia,serif;

    font-size:clamp(50px,9vw,120px);

    line-height:.88;

    letter-spacing:-4px;

    text-shadow:
        0 5px 30px rgba(0,0,0,.8);
}


.subtitle{

    margin-top:28px;

    font-size:11px;

    letter-spacing:6px;

    opacity:.75;
}


/* =========================
   PLAYER
========================= */

.player{

    position:fixed;

    left:50%;

    bottom:15px;

    transform:translateX(-50%);

    width:min(1100px,95%);

    padding:15px 20px;

    border:1px solid rgba(255,255,255,.25);

    border-radius:24px;

    background:rgba(10,10,10,.70);

    backdrop-filter:blur(20px);

    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 10px 40px rgba(0,0,0,.60);

    z-index:100;
}


.playerRow{

    display:flex;

    align-items:center;

    gap:12px;

    width:100%;
}


.playBtn{

    width:52px;

    height:52px;

    flex-shrink:0;

    border:2px solid white;

    border-radius:50%;

    background:rgba(255,255,255,.06);

    color:white;

    font-size:19px;

    cursor:pointer;
}


.playBtn:hover{

    background:rgba(255,255,255,.18);
}


.songInfo{

    flex:1;

    min-width:0;
}


.nowPlaying{

    font-size:9px;

    letter-spacing:3px;

    opacity:.55;

    margin-bottom:4px;
}


.songTitle{

    font-size:16px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.navButtons{

    display:flex;

    gap:7px;
}


.navBtn{

    width:42px;

    height:42px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.30);

    background:rgba(255,255,255,.07);

    color:white;

    font-size:22px;

    cursor:pointer;
}


.navBtn:hover{

    background:rgba(255,255,255,.20);
}


/* =========================
   VOLUME RIGHT
========================= */

.volumeControls{

    display:flex;

    align-items:center;

    gap:6px;

    margin-left:5px;
}


.volumeBtn{

    height:36px;

    min-width:42px;

    padding:0 9px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.28);

    background:rgba(255,255,255,.07);

    color:white;

    cursor:pointer;

    font-size:12px;
}


.volumeBtn:hover{

    background:rgba(255,255,255,.18);
}


.volumeBox{

    height:36px;

    padding:0 10px;

    display:flex;

    align-items:center;

    gap:7px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.25);

    background:rgba(0,0,0,.30);
}


.volumeRange{

    width:100px;

    height:5px;

    cursor:pointer;

    accent-color:white;
}


/* =========================
   PROGRESS
========================= */

.progress{

    width:100%;

    height:6px;

    margin-top:13px;

    background:rgba(255,255,255,.25);

    border-radius:10px;

    overflow:hidden;

    cursor:pointer;
}


.progressBar{

    width:0%;

    height:100%;

    background:white;

    border-radius:10px;
}


/* =========================
   SONG WINDOW
========================= */

.songWindow{

    display:none;

    position:fixed;

    inset:0;

    z-index:500;

    padding:35px 20px;

    overflow-y:auto;

    background:rgba(0,0,0,.92);

    backdrop-filter:blur(15px);
}


.songList{

    width:min(700px,100%);

    margin:auto;
}


.closeBtn{

    display:block;

    margin:0 auto 20px;

    padding:10px 25px;

    border:0;

    border-radius:25px;

    background:white;

    color:black;

    font-weight:bold;

    cursor:pointer;
}


.songItem{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:13px 17px;

    margin:7px 0;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(255,255,255,.08);
}


.songItem.active{

    background:rgba(255,255,255,.22);

    border-color:rgba(255,255,255,.40);
}


.songItem span{

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


.songPlay{

    flex-shrink:0;

    border:0;

    border-radius:20px;

    padding:8px 18px;

    cursor:pointer;
}


/* =========================
   SPECIAL POPUP
========================= */

.specialPopup{

    position:fixed;

    top:50%;

    left:50%;

    transform:
        translate(-50%,-50%)
        scale(.7);

    width:min(500px,90%);

    padding:35px 25px;

    text-align:center;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            rgba(20,20,20,.96),
            rgba(80,30,100,.96)
        );

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
        0 20px 80px rgba(0,0,0,.8);

    opacity:0;

    visibility:hidden;

    transition:.4s;

    z-index:2000;
}


.specialPopup.show{

    opacity:1;

    visibility:visible;

    transform:
        translate(-50%,-50%)
        scale(1);
}


.specialPopup h2{

    font-size:30px;

    margin-bottom:12px;
}


.specialPopup p{

    font-size:15px;

    opacity:.8;

    margin-bottom:20px;
}


.specialTimer{

    width:100%;

    height:5px;

    border-radius:10px;

    background:rgba(255,255,255,.20);

    overflow:hidden;
}


.specialTimerBar{

    width:100%;

    height:100%;

    background:white;

    transform-origin:left;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .top{

        padding:15px;
    }


    .clock{

        font-size:18px;
    }


    .date{

        font-size:8px;

        letter-spacing:1px;
    }


    .topBtn{

        padding:9px 10px;

        font-size:9px;
    }


    h1{

        font-size:50px;

        letter-spacing:-2px;
    }


    .badge{

        font-size:8px;

        letter-spacing:2px;
    }


    .subtitle{

        font-size:8px;

        letter-spacing:3px;
    }


    .player{

        width:97%;

        padding:12px;
    }


    .playerRow{

        gap:7px;
    }


    .playBtn{

        width:44px;

        height:44px;
    }


    .songTitle{

        font-size:13px;
    }


    .navBtn{

        width:36px;

        height:36px;

        font-size:20px;
    }


    .volumeBtn{

        min-width:34px;

        padding:0 6px;

        font-size:10px;
    }


    .volumeBox{

        padding:0 7px;
    }


    .volumeRange{

        width:65px;
    }

}


@media(max-width:450px){

    .volumeBox{

        display:none;
    }

    .volumeControls{

        gap:3px;
    }

    .volumeBtn{

        min-width:32px;

        padding:0 5px;
    }

    .main{

        padding-bottom:160px;
    }

}

</style>

</head>


<body>


<!-- TOP -->

<header class="top">

    <div>

        <div
            class="clock"
            id="liveTime">

            00:00:00

        </div>

        <div
            class="date"
            id="liveDate">

        </div>

    </div>


    <div class="topButtons">

        <button
            class="topBtn"
            onclick="openSongs()">

            🎵 ALL SONGS

        </button>


        <!-- नया BUTTON -->

        <button
            class="topBtn specialBtn"
            onclick="showSpecial()">

            ✨ SPECIAL

        </button>

    </div>

</header>


<!-- MAIN -->

<main class="main">

    <div class="badge">

        📸 U T T A M &nbsp; P H O T O G R A P H Y

    </div>


    <h1>

        UTTAM<br>

        PHOTOGRAPHY

    </h1>


    <div class="subtitle">

        MUSIC • PHOTOGRAPHY • MEMORIES

    </div>

</main>


<!-- PLAYER -->

<div
    class="player"
    id="player">

    <div class="playerRow">


        <button
            class="playBtn"
            id="playBtn"
            onclick="togglePlay()">

            ▶

        </button>


        <div class="songInfo">

            <div class="nowPlaying">

                NOW PLAYING

            </div>

            <div
                class="songTitle"
                id="songTitle">

                Song 1

            </div>

        </div>


        <div class="navButtons">

            <button
                class="navBtn"
                onclick="previousSong()">

                ‹

            </button>


            <button
                class="navBtn"
                onclick="nextSong()">

                ›

            </button>

        </div>


        <!-- VOLUME RIGHT SIDE -->

        <div class="volumeControls">

            <button
                class="volumeBtn"
                id="muteBtn"
                onclick="toggleMute()">

                🔊

            </button>


            <button
                class="volumeBtn"
                onclick="volumeDown()">

                −

            </button>


            <div class="volumeBox">

                🔊

                <input
                    type="range"
                    class="volumeRange"
                    id="volumeRange"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                    oninput="setVolume(this.value)">

            </div>


            <button
                class="volumeBtn"
                onclick="volumeUp()">

                +

            </button>

        </div>

    </div>


    <div
        class="progress"
        id="progress">

        <div
            class="progressBar"
            id="progressBar">

        </div>

    </div>

</div>


<!-- SONG WINDOW -->

<div
    class="songWindow"
    id="songWindow">

    <div class="songList">

        <button
            class="closeBtn"
            onclick="closeSongs()">

            ✕ CLOSE

        </button>

        <div id="songList"></div>

    </div>

</div>


<!-- SPECIAL POPUP -->

<div
    class="specialPopup"
    id="specialPopup">

    <h2>
        ✨ UTTAM PHOTOGRAPHY ✨
    </h2>

    <p>
        🎵 Welcome to My Music 🎵
    </p>

    <p>
        Enjoy your favourite songs!
    </p>


    <div class="specialTimer">

        <div
            class="specialTimerBar"
            id="specialTimerBar">

        </div>

    </div>

</div>


<audio id="audio"></audio>


<script>


/* =========================
   SONGS
========================= */

const songs = [];

for(let i = 1; i <= 36; i++){

    songs.push(
        "song (" + i + ").mp3"
    );

}


/* =========================
   VARIABLES
========================= */

let currentSong = 0;

const audio =
    document.getElementById("audio");

const playBtn =
    document.getElementById("playBtn");

const songTitle =
    document.getElementById("songTitle");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const volumeRange =
    document.getElementById("volumeRange");

const muteBtn =
    document.getElementById("muteBtn");


/* =========================
   LOAD SONG
========================= */

function loadSong(){

    audio.src =
        songs[currentSong];

    audio.load();

    songTitle.innerText =
        "Song " + (currentSong + 1);

    progressBar.style.width =
        "0%";

    updateSongList();

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay(){

    if(audio.paused){

        audio.play()
        .then(function(){

            playBtn.innerText =
                "❚❚";

        })
        .catch(function(){

            console.log(
                "Audio play नहीं हो पाया"
            );

        });

    }
    else{

        audio.pause();

        playBtn.innerText =
            "▶";

    }

}


/* =========================
   NEXT
========================= */

function nextSong(){

    currentSong++;

    if(
        currentSong >=
        songs.length
    ){

        currentSong = 0;

    }

    loadSong();

    audio.play()
    .then(function(){

        playBtn.innerText =
            "❚❚";

    })
    .catch(function(){

        playBtn.innerText =
            "▶";

    });

}


/* =========================
   PREVIOUS
========================= */

function previousSong(){

    currentSong--;

    if(currentSong < 0){

        currentSong =
            songs.length - 1;

    }

    loadSong();

    audio.play()
    .then(function(){

        playBtn.innerText =
            "❚❚";

    })
    .catch(function(){

        playBtn.innerText =
            "▶";

    });

}


/* =========================
   AUTO NEXT
========================= */

audio.addEventListener(
    "ended",
    function(){

        nextSong();

    }
);


/* =========================
   PLAY / PAUSE ICON
========================= */

audio.addEventListener(
    "play",
    function(){

        playBtn.innerText =
            "❚❚";

    }
);


audio.addEventListener(
    "pause",
    function(){

        playBtn.innerText =
            "▶";

    }
);


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
    "timeupdate",
    function(){

        if(
            audio.duration &&
            isFinite(audio.duration)
        ){

            const percent =
                (
                    audio.currentTime /
                    audio.duration
                ) * 100;

            progressBar.style.width =
                percent + "%";

        }

    }
);


/* =========================
   PROGRESS CLICK
========================= */

progress.addEventListener(
    "click",
    function(event){

        if(
            !audio.duration ||
            !isFinite(audio.duration)
        ){

            return;

        }

        const rect =
            progress.getBoundingClientRect();

        const percent =
            (
                event.clientX -
                rect.left
            ) / rect.width;

        audio.currentTime =
            percent *
            audio.duration;

    }
);


/* =========================
   VOLUME
========================= */

function setVolume(value){

    audio.volume =
        Number(value);

    volumeRange.value =
        audio.volume;

    if(audio.volume > 0){

        audio.muted = false;

        muteBtn.innerText =
            "🔊";

    }

}


function volumeUp(){

    let value =
        audio.volume + 0.1;

    if(value > 1){

        value = 1;

    }

    setVolume(value);

}


function volumeDown(){

    let value =
        audio.volume - 0.1;

    if(value < 0){

        value = 0;

    }

    setVolume(value);

}


function toggleMute(){

    audio.muted =
        !audio.muted;

    if(audio.muted){

        muteBtn.innerText =
            "🔇";

    }
    else{

        muteBtn.innerText =
            "🔊";

    }

}


/* =========================
   ALL SONGS
========================= */

function createSongList(){

    const list =
        document.getElementById(
            "songList"
        );

    list.innerHTML = "";

    songs.forEach(
        function(song,index){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "songItem";

            item.innerHTML = `

                <span>
                    🎵 Song ${index + 1}
                </span>

                <button
                    class="songPlay"
                    onclick="selectSong(${index})">

                    ▶ Play

                </button>

            `;

            list.appendChild(item);

        }
    );

}


function updateSongList(){

    const items =
        document.querySelectorAll(
            ".songItem"
        );

    items.forEach(
        function(item,index){

            if(index === currentSong){

                item.classList.add(
                    "active"
                );

            }
            else{

                item.classList.remove(
                    "active"
                );

            }

        }
    );

}


function selectSong(index){

    currentSong =
        index;

    loadSong();

    audio.play()
    .then(function(){

        playBtn.innerText =
            "❚❚";

    })
    .catch(function(){

        playBtn.innerText =
            "▶";

    });

    closeSongs();

}


function openSongs(){

    document
        .getElementById("songWindow")
        .style.display =
        "block";

}


function closeSongs(){

    document
        .getElementById("songWindow")
        .style.display =
        "none";

}


/* =========================
   DATE & TIME
========================= */

function updateDateTime(){

    const now =
        new Date();

    const time =
        now.toLocaleTimeString(
            "hi-IN",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",
                hour12:true
            }
        );

    const date =
        now.toLocaleDateString(
            "hi-IN",
            {
                weekday:"long",
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        );

    document
        .getElementById("liveTime")
        .innerText =
        time;

    document
        .getElementById("liveDate")
        .innerText =
        date;

}

updateDateTime();

setInterval(
    updateDateTime,
    1000
);


/* =========================
   SPACE KEY
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.code === "Space" &&
            event.target.tagName !== "INPUT"
        ){

            event.preventDefault();

            togglePlay();

        }


        if(
            event.code === "ArrowRight" &&
            event.target.tagName !== "INPUT"
        ){

            nextSong();

        }


        if(
            event.code === "ArrowLeft" &&
            event.target.tagName !== "INPUT"
        ){

            previousSong();

        }

    }
);


/* =========================
   SPECIAL BUTTON
   10 SECOND DISPLAY
========================= */

let specialTimer;


function showSpecial(){

    const popup =
        document.getElementById(
            "specialPopup"
        );

    const bar =
        document.getElementById(
            "specialTimerBar"
        );


    clearTimeout(
        specialTimer
    );


    popup.classList.add(
        "show"
    );


    bar.style.transition =
        "none";

    bar.style.transform =
        "scaleX(1)";


    void bar.offsetWidth;


    bar.style.transition =
        "transform 10s linear";

    bar.style.transform =
        "scaleX(0)";


    specialTimer =
        setTimeout(
            function(){

                popup.classList.remove(
                    "show"
                );

            },
            10000
        );

}


/* =========================
   START
========================= */

createSongList();

loadSong();

setVolume(1);

</script>

</body>
</html>
