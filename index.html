<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>UTTAM PHOTOGRAPHY</title>

<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

    color:white;

    background-color:#000;

    background-image:
        linear-gradient(
            rgba(0,0,0,.42),
            rgba(0,0,0,.58)
        ),
        url("background (1).jpg");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    background-attachment:fixed;

    transition:
        background-image 1s ease-in-out;

    overflow-x:hidden;
}


/* =========================
   TOP TIME
========================= */

.clockBox{

    position:fixed;

    top:25px;
    left:28px;

    z-index:20;

}

.time{

    font-size:24px;

    font-weight:bold;

    text-shadow:
        0 2px 10px #000;

}

.date{

    margin-top:5px;

    font-size:10px;

    letter-spacing:2px;

    opacity:.8;

}


/* =========================
   ALL SONGS
========================= */

.allSongs{

    position:fixed;

    top:25px;
    right:28px;

    z-index:20;

    padding:12px 20px;

    border:1px solid
    rgba(255,255,255,.35);

    border-radius:30px;

    background:
    rgba(255,255,255,.10);

    backdrop-filter:blur(15px);

    -webkit-backdrop-filter:blur(15px);

    font-size:13px;

    font-weight:bold;

    letter-spacing:1px;

}


/* =========================
   MAIN
========================= */

.main{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:
        100px 20px 190px;

}


/* =========================
   NAME BOX
========================= */

.nameBox{

    padding:10px 25px;

    margin-bottom:30px;

    border:1px solid
    rgba(255,255,255,.35);

    border-radius:30px;

    background:
    rgba(255,255,255,.08);

    backdrop-filter:blur(12px);

    -webkit-backdrop-filter:blur(12px);

    font-size:12px;

    font-weight:bold;

    letter-spacing:5px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);

}


/* =========================
   MAIN TITLE
========================= */

.title{

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:
        clamp(55px,9vw,125px);

    line-height:.84;

    font-weight:bold;

    letter-spacing:-3px;

    background:
        linear-gradient(
            180deg,
            #fff2b0 0%,
            #d7b653 45%,
            #8c6818 100%
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    text-shadow:
        0 8px 30px
        rgba(0,0,0,.8);

}


/* =========================
   SUBTITLE
========================= */

.subtitle{

    margin-top:30px;

    font-size:12px;

    letter-spacing:7px;

    font-weight:bold;

    opacity:.85;

}


/* =========================
   MUSIC PLAYER
========================= */

.player{

    position:fixed;

    left:50%;

    bottom:18px;

    transform:
        translateX(-50%);

    width:
        min(850px,92%);

    padding:
        16px 20px 17px;

    z-index:50;

    border:
        1px solid
        rgba(255,255,255,.32);

    border-radius:25px;

    background:
        rgba(255,255,255,.11);

    backdrop-filter:
        blur(20px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(20px)
        saturate(140%);

    box-shadow:

        0 15px 45px
        rgba(0,0,0,.55),

        inset 0 1px 1px
        rgba(255,255,255,.15);

}


/* =========================
   PLAYER TOP
========================= */

.playerTop{

    display:flex;

    align-items:center;

    gap:15px;

}


/* =========================
   PLAY BUTTON
========================= */

.playButton{

    width:52px;

    height:52px;

    min-width:52px;

    border-radius:50%;

    border:
        2px solid
        rgba(255,255,255,.9);

    background:
        rgba(255,255,255,.08);

    color:white;

    font-size:21px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.2s;

}

.playButton:hover{

    background:
        rgba(255,255,255,.22);

    transform:scale(1.05);

}


/* =========================
   SONG INFORMATION
========================= */

.songInfo{

    flex:1;

    min-width:0;

    text-align:left;

}

.nowPlaying{

    font-size:9px;

    letter-spacing:3px;

    opacity:.55;

    margin-bottom:5px;

}

.songName{

    font-size:16px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


/* =========================
   PREVIOUS NEXT
========================= */

.navigation{

    display:flex;

    align-items:center;

    gap:12px;

}

.navButton{

    border:0;

    background:transparent;

    color:white;

    font-size:31px;

    width:35px;

    height:40px;

    cursor:pointer;

    opacity:.9;

}

.navButton:hover{

    opacity:1;

    transform:scale(1.15);

}


/* =========================
   PROGRESS BAR
========================= */

.progressArea{

    width:100%;

    height:7px;

    margin-top:13px;

    background:
        rgba(255,255,255,.22);

    border-radius:20px;

    cursor:pointer;

    overflow:hidden;

}

.progressBar{

    width:0%;

    height:100%;

    background:white;

    border-radius:20px;

    transition:
        width .1s linear;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .clockBox{

        top:15px;
        left:15px;

    }

    .time{

        font-size:18px;

    }

    .allSongs{

        top:15px;
        right:15px;

        padding:
            9px 14px;

        font-size:11px;

    }

    .nameBox{

        font-size:9px;

        letter-spacing:3px;

    }

    .title{

        font-size:54px;

        letter-spacing:-2px;

    }

    .subtitle{

        font-size:9px;

        letter-spacing:4px;

    }

    .player{

        width:94%;

        bottom:10px;

        padding:
            13px 14px;

    }

    .playButton{

        width:46px;

        height:46px;

        min-width:46px;

    }

    .songName{

        font-size:14px;

    }

    .navButton{

        font-size:27px;

    }

}

</style>
</head>


<body>


<!-- =========================
     CLOCK
========================= -->

<div class="clockBox">

    <div
        class="time"
        id="time">
        00:00:00
    </div>

    <div
        class="date"
        id="date">
        LOADING...
    </div>

</div>


<!-- =========================
     ALL SONGS
========================= -->

<div class="allSongs">

    🎵 ALL SONGS

</div>


<!-- =========================
     MAIN
========================= -->

<main class="main">

    <div class="nameBox">

        U T T A M &nbsp;
        P H O T O G R A P H Y

    </div>


    <h1 class="title">

        UTTAM<br>
        PHOTOGRAPHY

    </h1>


    <div class="subtitle">

        MUSIC • PHOTOGRAPHY • MEMORIES

    </div>

</main>


<!-- =========================
     MUSIC PLAYER
========================= -->

<div class="player">


    <div class="playerTop">


        <button
            class="playButton"
            id="playButton">

            ▶

        </button>


        <div class="songInfo">

            <div class="nowPlaying">

                NOW PLAYING

            </div>

            <div
                class="songName"
                id="songName">

                🎵 Song 1

            </div>

        </div>


        <div class="navigation">


            <button
                class="navButton"
                id="previous">

                ‹

            </button>


            <button
                class="navButton"
                id="next">

                ›

            </button>


        </div>


    </div>


    <div
        class="progressArea"
        id="progressArea">

        <div
            class="progressBar"
            id="progressBar">

        </div>

    </div>


</div>


<!-- AUDIO -->

<audio
    id="audio"
    preload="metadata">
</audio>


<script>


/* =====================================================
   SONGS
===================================================== */

const songs = [

    "song (1).mp3",
    "song (2).mp3",
    "song (3).mp3",
    "song (4).mp3",
    "song (5).mp3",
    "song (6).mp3",
    "song (7).mp3",
    "song (8).mp3",
    "song (9).mp3",
    "song (10).mp3",
    "song (11).mp3",
    "song (12).mp3",
    "song (13).mp3",
    "song (14).mp3",
    "song (15).mp3",
    "song (16).mp3",
    "song (17).mp3",
    "song (18).mp3"

];


/* =====================================================
   5 BACKGROUNDS
===================================================== */

const backgrounds = [

    "background (1).jpg",

    "background (2).jpg",

    "background (3).jpg",

    "background (4).jpg",

    "background (5).jpg"

];


/* =====================================================
   VARIABLES
===================================================== */

let currentSong = 0;

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("playButton");

const songName =
    document.getElementById("songName");

const previous =
    document.getElementById("previous");

const next =
    document.getElementById("next");

const progressArea =
    document.getElementById("progressArea");

const progressBar =
    document.getElementById("progressBar");


/* =====================================================
   CHANGE BACKGROUND
===================================================== */

function changeBackground(){

    const bgIndex =
        currentSong % backgrounds.length;

    document.body.style.backgroundImage =
        'linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.58)),url("' +
        backgrounds[bgIndex] +
        '")';

}


/* =====================================================
   LOAD SONG
===================================================== */

function loadSong(){

    audio.src =
        songs[currentSong];

    songName.innerHTML =
        "🎵 Song " +
        (currentSong + 1);

    progressBar.style.width =
        "0%";

    changeBackground();

}


/* =====================================================
   PLAY
===================================================== */

function playSong(){

    audio.play()
    .then(()=>{

        playButton.innerHTML =
            "Ⅱ";

    })
    .catch(()=>{

        playButton.innerHTML =
            "▶";

    });

}


/* =====================================================
   PAUSE
===================================================== */

function pauseSong(){

    audio.pause();

    playButton.innerHTML =
        "▶";

}


/* =====================================================
   PLAY / PAUSE
===================================================== */

playButton.addEventListener(
    "click",
    function(){

        if(audio.paused){

            playSong();

        }
        else{

            pauseSong();

        }

    }
);


/* =====================================================
   NEXT SONG
===================================================== */

function nextSong(){

    currentSong++;

    if(
        currentSong >=
        songs.length
    ){

        currentSong = 0;

    }

    loadSong();

    playSong();

}


/* =====================================================
   PREVIOUS SONG
===================================================== */

function previousSong(){

    currentSong--;

    if(currentSong < 0){

        currentSong =
            songs.length - 1;

    }

    loadSong();

    playSong();

}


/* BUTTONS */

next.addEventListener(
    "click",
    nextSong
);

previous.addEventListener(
    "click",
    previousSong
);


/* =====================================================
   AUTOMATIC NEXT SONG
===================================================== */

audio.addEventListener(
    "ended",
    function(){

        nextSong();

    }
);


/* =====================================================
   PROGRESS
===================================================== */

audio.addEventListener(
    "timeupdate",
    function(){

        if(
            audio.duration &&
            !isNaN(audio.duration)
        ){

            const percent =
                (
                    audio.currentTime /
                    audio.duration
                ) * 100;

            progressBar.style.width =
                percent + "%";

        }

    }
);


/* =====================================================
   CLICK PROGRESS
===================================================== */

progressArea.addEventListener(
    "click",
    function(event){

        if(!audio.duration)
            return;

        const width =
            progressArea.clientWidth;

        const clickX =
            event.offsetX;

        audio.currentTime =
            (clickX / width) *
            audio.duration;

    }
);


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

    const now =
        new Date();


    let hour =
        now.getHours();

    const minute =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const second =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    const ampm =
        hour >= 12
        ? "pm"
        : "am";


    hour =
        hour % 12;


    if(hour === 0){

        hour = 12;

    }


    hour =
        String(hour)
        .padStart(2,"0");


    document.getElementById(
        "time"
    ).innerHTML =

        hour + ":" +
        minute + ":" +
        second + " " +
        ampm;


    document.getElementById(
        "date"
    ).innerHTML =

        now.toLocaleDateString(
            "en-IN",
            {
                weekday:"long",
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        ).toUpperCase();

}


setInterval(
    updateClock,
    1000
);

updateClock();


/* =====================================================
   START FIRST SONG
===================================================== */

loadSong();

</script>

</body>
</html>
