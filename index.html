<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTTAM PHOTOGRAPHY</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    color:white;
    background:#000;
    overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

#background{
    position:fixed;
    inset:0;
    z-index:-10;

    background-image:
    linear-gradient(
        rgba(0,0,0,.20),
        rgba(0,0,0,.65)
    ),
    url("background (1).jpg");

    background-size:cover;
    background-position:center;

    transition:background-image 1s ease-in-out;
}


/* =========================
   TOP BAR
========================= */

.top{
    position:fixed;
    top:0;
    left:0;
    right:0;

    z-index:20;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:22px 28px;
}

.time{
    font-size:22px;
    font-weight:bold;

    text-shadow:
    0 3px 15px #000;
}

.date{
    margin-top:5px;

    font-size:9px;

    letter-spacing:2px;

    opacity:.85;
}

.allSongs{
    padding:10px 18px;

    border-radius:30px;

    border:
    1px solid
    rgba(255,255,255,.35);

    background:
    rgba(255,255,255,.10);

    color:white;

    font-weight:bold;

    cursor:pointer;

    backdrop-filter:blur(15px);

    transition:.3s;
}

.allSongs:hover{
    background:
    rgba(255,255,255,.22);

    transform:scale(1.05);
}


/* =========================
   MAIN
========================= */

.main{
    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:
    80px 20px 170px;
}

.content{
    width:100%;
    max-width:1100px;
}


/* =========================
   UTTAM PHOTOGRAPHY
========================= */

.tag{
    display:inline-block;

    padding:
    9px 22px;

    border-radius:30px;

    border:
    1px solid
    rgba(255,255,255,.35);

    background:
    rgba(0,0,0,.25);

    backdrop-filter:blur(15px);

    font-size:10px;

    letter-spacing:4px;
}


h1{
    margin-top:25px;

    font-family:
    Georgia,
    "Times New Roman",
    serif;

    font-size:
    clamp(
        48px,
        9vw,
        110px
    );

    line-height:.90;

    letter-spacing:-4px;

    text-shadow:
    0 8px 30px
    rgba(0,0,0,.95);
}


.gold{
    background:
    linear-gradient(
        90deg,
        #ffffff,
        #d6a83e,
        #fff4c4,
        #c89124,
        #ffffff
    );

    background-size:300%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
    goldMove 5s linear infinite;
}

@keyframes goldMove{

    0%{
        background-position:0%;
    }

    100%{
        background-position:300%;
    }
}


.subtitle{
    margin-top:20px;

    font-size:11px;

    letter-spacing:6px;

    opacity:.85;
}


/* =========================
   GLASS MUSIC PLAYER
========================= */

.player{
    position:fixed;

    left:50%;
    bottom:18px;

    transform:
    translateX(-50%);

    z-index:50;

    width:
    min(
        850px,
        calc(100% - 24px)
    );

    padding:16px 18px;

    border-radius:26px;

    background:
    rgba(255,255,255,.10);

    border:
    1px solid
    rgba(255,255,255,.30);

    backdrop-filter:
    blur(25px);

    -webkit-backdrop-filter:
    blur(25px);

    box-shadow:
    0 18px 60px
    rgba(0,0,0,.70),

    inset 0 1px 1px
    rgba(255,255,255,.15);
}


.playerRow{
    display:flex;

    align-items:center;

    gap:12px;
}


/* PLAY BUTTON */

.playButton{
    width:52px;
    height:52px;

    flex-shrink:0;

    border-radius:50%;

    border:
    2px solid
    rgba(255,255,255,.85);

    background:
    rgba(0,0,0,.40);

    color:white;

    font-size:20px;

    cursor:pointer;

    transition:.25s;
}

.playButton:hover{
    transform:scale(1.10);

    background:
    rgba(255,255,255,.15);
}


/* SONG INFORMATION */

.songInfo{
    flex:1;

    min-width:0;
}

.nowPlaying{
    font-size:8px;

    letter-spacing:2px;

    opacity:.55;
}

.songTitle{
    margin-top:5px;

    font-size:15px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* PREVIOUS / NEXT */

.control{
    border:0;

    background:transparent;

    color:white;

    font-size:36px;

    cursor:pointer;

    padding:
    3px 8px;

    transition:.2s;
}

.control:hover{
    transform:scale(1.25);
}


/* PROGRESS */

.progress{
    width:100%;

    height:5px;

    margin-top:12px;

    appearance:none;

    border-radius:20px;

    background:
    rgba(255,255,255,.25);

    cursor:pointer;
}

.progress::-webkit-slider-thumb{
    appearance:none;

    width:13px;
    height:13px;

    border-radius:50%;

    background:white;

    box-shadow:
    0 0 10px
    rgba(255,255,255,.8);
}


/* =========================
   ALL SONGS WINDOW
========================= */

.songList{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    overflow:auto;

    padding:
    80px 20px 120px;

    background:
    rgba(0,0,0,.94);

    backdrop-filter:
    blur(20px);
}

.songList.show{
    display:block;
}

.songContainer{
    width:100%;

    max-width:850px;

    margin:auto;
}

.closeButton{
    float:right;

    border:
    1px solid
    rgba(255,255,255,.4);

    background:transparent;

    color:white;

    padding:
    8px 16px;

    border-radius:25px;

    cursor:pointer;
}

.songContainer h2{
    margin-bottom:25px;

    font-size:30px;
}

.songItem{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:14px;

    margin:8px 0;

    border-radius:15px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid
    rgba(255,255,255,.10);
}

.songItem.active{
    background:
    rgba(255,255,255,.20);

    border-left:
    3px solid
    #e2b447;
}

.songItem button{
    border:0;

    border-radius:25px;

    padding:
    8px 16px;

    cursor:pointer;

    font-weight:bold;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .top{
        padding:14px;
    }

    .time{
        font-size:17px;
    }

    .date{
        font-size:7px;
        letter-spacing:1px;
    }

    .allSongs{
        padding:
        8px 12px;

        font-size:10px;
    }

    h1{
        font-size:52px;

        letter-spacing:-2px;
    }

    .subtitle{
        font-size:8px;

        letter-spacing:3px;
    }

    .player{
        bottom:8px;

        padding:11px;
    }

    .playButton{
        width:45px;
        height:45px;
    }

    .songTitle{
        font-size:13px;
    }

}

</style>

</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<div id="background"></div>


<!-- =========================
     TOP
========================= -->

<div class="top">

    <div>

        <div
        class="time"
        id="time">
        00:00:00
        </div>

        <div
        class="date"
        id="date">
        </div>

    </div>


    <button
    class="allSongs"
    onclick="openSongs()">

        🎵 ALL SONGS

    </button>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="main">

    <div class="content">

        <div class="tag">

            📸 UTTAM PHOTOGRAPHY

        </div>


        <h1 class="gold">

            UTTAM<br>

            PHOTOGRAPHY

        </h1>


        <div class="subtitle">

            MUSIC • PHOTOGRAPHY • MEMORIES

        </div>

    </div>

</div>


<!-- =========================
     MUSIC PLAYER
========================= -->

<div class="player">

    <div class="playerRow">


        <button
        class="playButton"
        id="playButton"
        onclick="playPause()">

            ▶

        </button>


        <div class="songInfo">

            <div class="nowPlaying">

                NOW PLAYING

            </div>


            <div
            class="songTitle"
            id="songTitle">

                Song 1

            </div>

        </div>


        <button
        class="control"
        onclick="previousSong()">

            ‹

        </button>


        <button
        class="control"
        onclick="nextSong()">

            ›

        </button>

    </div>


    <input
    type="range"
    id="progress"
    class="progress"
    min="0"
    max="100"
    value="0">


    <audio
    id="audio"
    preload="metadata">
    </audio>

</div>


<!-- =========================
     SONG LIST
========================= -->

<div
class="songList"
id="songList">

    <div class="songContainer">


        <button
        class="closeButton"
        onclick="closeSongs()">

            ✕ CLOSE

        </button>


        <h2>

            🎵 MY SONGS

        </h2>


        <div
        id="songItems">
        </div>

    </div>

</div>


<script>


/* =========================
   YOUR SONG FILES
========================= */

const songs = [

    "song (1).mp3",
    "song (2).mp3",
    "song (3).mp3",
    "song (4).mp3",
    "song (5).mp3",
    "song (6).mp3",
    "song (7).mp3",
    "song (8).mp3",
    "song (9).mp3",
    "song (10).mp3",
    "song (11).mp3",
    "song (12).mp3",
    "song (13).mp3",
    "song (14).mp3",
    "song (15).mp3",
    "song (16).mp3",
    "song (17).mp3",
    "song (18).mp3"
];


/* =========================
   YOUR EXACT BACKGROUND NAMES
========================= */

const backgrounds = [

    "background (1).jpg",

    "background (2).jpg",

    "background (3).jpg",

    "background (4).jpg",

    "background (5).jpg"

];


let currentSong = 0;


/* =========================
   ELEMENTS
========================= */

const audio =
document.getElementById("audio");

const playButton =
document.getElementById("playButton");

const songTitle =
document.getElementById("songTitle");

const progress =
document.getElementById("progress");

const background =
document.getElementById("background");


/* =========================
   CHANGE BACKGROUND
========================= */

function changeBackground(){

    const bg =
    backgrounds[
        currentSong %
        backgrounds.length
    ];


    background.style.backgroundImage =

    `
    linear-gradient(
        rgba(0,0,0,.20),
        rgba(0,0,0,.65)
    ),
    url("${bg}")
    `;

}


/* =========================
   LOAD SONG
========================= */

function loadSong(
    index,
    autoPlay = false
){

    currentSong = index;


    if(
        currentSong < 0
    ){

        currentSong =
        songs.length - 1;

    }


    if(
        currentSong >= songs.length
    ){

        currentSong = 0;

    }


    audio.src =
    songs[currentSong];


    songTitle.innerText =
    "🎵 Song " +
    (currentSong + 1);


    progress.value = 0;


    changeBackground();


    updateSongList();


    if(autoPlay){

        audio.play()
        .catch(function(){

        });

    }

}


/* =========================
   PLAY / PAUSE
========================= */

function playPause(){

    if(
        audio.paused
    ){

        audio.play()
        .catch(function(){

            alert(
                "Song file नहीं मिल रही है। GitHub में MP3 का नाम check करें।"
            );

        });

    }
    else{

        audio.pause();

    }

}


/* =========================
   PLAY EVENT
========================= */

audio.addEventListener(
"play",
function(){

    playButton.innerText =
    "❚❚";

});


/* =========================
   PAUSE EVENT
========================= */

audio.addEventListener(
"pause",
function(){

    playButton.innerText =
    "▶";

});


/* =========================
   SONG END = NEXT SONG
========================= */

audio.addEventListener(
"ended",
function(){

    nextSong();

});


/* =========================
   NEXT
========================= */

function nextSong(){

    currentSong++;


    if(
        currentSong >= songs.length
    ){

        currentSong = 0;

    }


    loadSong(
        currentSong,
        true
    );

}


/* =========================
   PREVIOUS
========================= */

function previousSong(){

    currentSong--;


    if(
        currentSong < 0
    ){

        currentSong =
        songs.length - 1;

    }


    loadSong(
        currentSong,
        true
    );

}


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
"timeupdate",
function(){

    if(
        audio.duration
    ){

        progress.value =

        (
            audio.currentTime /
            audio.duration
        ) * 100;

    }

});


progress.addEventListener(
"input",
function(){

    if(
        audio.duration
    ){

        audio.currentTime =

        (
            progress.value /
            100
        ) *
        audio.duration;

    }

});


/* =========================
   SONG LIST
========================= */

function createSongList(){

    const box =
    document.getElementById(
        "songItems"
    );


    box.innerHTML = "";


    songs.forEach(
    function(song,index){

        const item =
        document.createElement(
            "div"
        );


        item.className =
        "songItem";


        item.innerHTML = `

            <span>

                🎵 Song ${index + 1}

            </span>

            <button
            onclick="
            selectSong(${index})
            ">

                ▶ PLAY

            </button>

        `;


        box.appendChild(item);

    });

}


/* =========================
   SELECT SONG
========================= */

function selectSong(index){

    loadSong(
        index,
        true
    );


    closeSongs();

}


/* =========================
   UPDATE SONG LIST
========================= */

function updateSongList(){

    const items =
    document.querySelectorAll(
        ".songItem"
    );


    items.forEach(
    function(item,index){

        if(
            index === currentSong
        ){

            item.classList.add(
                "active"
            );

        }
        else{

            item.classList.remove(
                "active"
            );

        }

    });

}


/* =========================
   OPEN SONGS
========================= */

function openSongs(){

    document
    .getElementById(
        "songList"
    )
    .classList.add(
        "show"
    );


    updateSongList();

}


/* =========================
   CLOSE SONGS
========================= */

function closeSongs(){

    document
    .getElementById(
        "songList"
    )
    .classList.remove(
        "show"
    );

}


/* =========================
   CLOCK
========================= */

function updateClock(){

    const now =
    new Date();


    document
    .getElementById("time")
    .innerText =

    now.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );


    document
    .getElementById("date")
    .innerText =

    now.toLocaleDateString(
        "en-IN",
        {
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    ).toUpperCase();

}


/* =========================
   START WEBSITE
========================= */

createSongList();

loadSong(0,false);

updateClock();

setInterval(
    updateClock,
    1000
);

</script>

</body>
</html>
