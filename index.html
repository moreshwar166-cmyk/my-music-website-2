<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTTAM PHOTOGRAPHY - MY MUSIC</title>

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    overflow-x:hidden;
    background:#111;
}


/* =========================
   BACKGROUND
========================= */

#backgroundImage{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:0;

    opacity:1;

    transition:opacity .7s ease;
}

.backgroundOverlay{

    position:fixed;

    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.40),
            rgba(0,0,0,.68)
        );

    z-index:1;

    pointer-events:none;
}


/* =========================
   EFFECTS
========================= */

#effects{

    position:fixed;

    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:2;

    opacity:0;

    transition:opacity .5s;
}

#effects.active{
    opacity:1;
}


.light{

    position:absolute;

    width:250px;
    height:250px;

    border-radius:50%;

    filter:blur(50px);

    opacity:.55;

    animation:
        moveLight 5s infinite alternate ease-in-out;
}

.light.one{
    background:#8b5cf6;
    left:5%;
    top:15%;
}

.light.two{
    background:#ec4899;
    right:5%;
    top:30%;
    animation-delay:1s;
}

.light.three{
    background:#06b6d4;
    left:35%;
    bottom:5%;
    animation-delay:2s;
}

@keyframes moveLight{

    0%{
        transform:translate(0,0) scale(.8);
    }

    100%{
        transform:translate(150px,-80px) scale(1.3);
    }

}


.particle{

    position:absolute;

    width:5px;
    height:5px;

    background:white;

    border-radius:50%;

    box-shadow:
        0 0 10px white,
        0 0 20px white;

    animation:
        particleMove linear infinite;
}

@keyframes particleMove{

    from{
        transform:
            translateY(110vh)
            rotate(0deg);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:1;
    }

    to{
        transform:
            translateY(-20vh)
            rotate(360deg);

        opacity:0;
    }

}


/* =========================
   PAGE
========================= */

.page{

    position:relative;

    z-index:5;

    min-height:100vh;
}


/* =========================
   TOP
========================= */

.top{

    width:100%;

    padding:22px 30px;

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:20px;
}


.clock{

    font-size:25px;

    font-weight:bold;

    letter-spacing:1px;
}


.date{

    margin-top:5px;

    font-size:11px;

    letter-spacing:2px;

    opacity:.75;
}


/* =========================
   SOCIAL BUTTONS
========================= */

.topButtons{

    display:flex;

    gap:12px;

    align-items:center;
}


.socialBtn{

    width:48px;
    height:48px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.55);

    background:rgba(0,0,0,.25);

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    backdrop-filter:blur(12px);

    transition:.25s;

    font-size:22px;

    font-weight:bold;
}


.socialBtn:hover{

    background:rgba(255,255,255,.18);

    transform:translateY(-3px) scale(1.05);

    border-color:white;
}


/* INSTAGRAM */

.instagramIcon{

    width:22px;
    height:22px;

    border:2px solid white;

    border-radius:6px;

    position:relative;
}


.instagramIcon:before{

    content:"";

    position:absolute;

    width:8px;
    height:8px;

    border:2px solid white;

    border-radius:50%;

    left:5px;
    top:5px;
}


.instagramIcon:after{

    content:"";

    position:absolute;

    width:3px;
    height:3px;

    background:white;

    border-radius:50%;

    right:2px;
    top:2px;
}


/* YOUTUBE */

.youtubeIcon{

    width:25px;
    height:18px;

    border-radius:5px;

    background:white;

    position:relative;
}


.youtubeIcon:after{

    content:"";

    position:absolute;

    left:10px;
    top:5px;

    border-left:8px solid #111;

    border-top:4px solid transparent;

    border-bottom:4px solid transparent;
}


/* WHATSAPP */

.whatsappIcon{

    width:23px;
    height:23px;

    border:2px solid white;

    border-radius:50%;

    position:relative;

    font-size:14px;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* =========================
   MAIN
========================= */

.main{

    min-height:calc(100vh - 100px);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:30px 20px 180px;
}


.badge{

    padding:10px 25px;

    border:1px solid rgba(255,255,255,.30);

    border-radius:30px;

    background:rgba(0,0,0,.25);

    backdrop-filter:blur(10px);

    font-size:11px;

    letter-spacing:4px;

    margin-bottom:30px;
}


h1{

    font-family:Georgia,serif;

    font-size:clamp(50px,9vw,120px);

    line-height:.88;

    letter-spacing:-4px;

    text-shadow:
        0 5px 30px rgba(0,0,0,.8);
}


.subtitle{

    margin-top:28px;

    font-size:11px;

    letter-spacing:6px;

    opacity:.75;
}


/* =========================
   PLAYER
========================= */

.player{

    position:fixed;

    left:50%;

    bottom:15px;

    transform:translateX(-50%);

    width:min(1100px,95%);

    padding:15px 20px;

    border:1px solid rgba(255,255,255,.25);

    border-radius:24px;

    background:rgba(10,10,10,.70);

    backdrop-filter:blur(20px);

    box-shadow:
        0 10px 40px rgba(0,0,0,.60);

    z-index:100;
}


.playerRow{

    display:flex;

    align-items:center;

    gap:12px;

    width:100%;
}


.playBtn{

    width:52px;
    height:52px;

    flex-shrink:0;

    border:2px solid white;

    border-radius:50%;

    background:rgba(255,255,255,.06);

    color:white;

    font-size:19px;

    cursor:pointer;
}


.playBtn:hover{

    background:rgba(255,255,255,.18);
}


.songInfo{

    flex:1;

    min-width:0;
}


.nowPlaying{

    font-size:9px;

    letter-spacing:3px;

    opacity:.55;

    margin-bottom:4px;
}


.songTitle{

    font-size:16px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.navButtons{

    display:flex;

    gap:7px;
}


.navBtn{

    width:42px;
    height:42px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.30);

    background:rgba(255,255,255,.07);

    color:white;

    font-size:22px;

    cursor:pointer;
}


.navBtn:hover{

    background:rgba(255,255,255,.20);
}


/* =========================
   VOLUME
========================= */

.volumeControls{

    display:flex;

    align-items:center;

    gap:6px;

    margin-left:5px;
}


.volumeBtn{

    height:36px;

    min-width:42px;

    padding:0 9px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.28);

    background:rgba(255,255,255,.07);

    color:white;

    cursor:pointer;

    font-size:12px;
}


.volumeBtn:hover{

    background:rgba(255,255,255,.18);
}


.volumeBox{

    height:36px;

    padding:0 10px;

    display:flex;

    align-items:center;

    gap:7px;

    border-radius:20px;

    border:1px solid rgba(255,255,255,.25);

    background:rgba(0,0,0,.30);
}


.volumeRange{

    width:100px;

    height:5px;

    cursor:pointer;

    accent-color:white;
}


/* =========================
   PROGRESS
========================= */

.progress{

    width:100%;

    height:6px;

    margin-top:13px;

    background:rgba(255,255,255,.25);

    border-radius:10px;

    overflow:hidden;

    cursor:pointer;
}


.progressBar{

    width:0%;

    height:100%;

    background:white;

    border-radius:10px;
}


/* =========================
   SONG WINDOW
========================= */

.songWindow{

    display:none;

    position:fixed;

    inset:0;

    z-index:500;

    padding:35px 20px;

    overflow-y:auto;

    background:rgba(0,0,0,.92);

    backdrop-filter:blur(15px);
}


.songList{

    width:min(700px,100%);

    margin:auto;
}


.closeBtn{

    display:block;

    margin:0 auto 20px;

    padding:10px 25px;

    border:0;

    border-radius:25px;

    background:white;

    color:black;

    font-weight:bold;

    cursor:pointer;
}


.songItem{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:13px 17px;

    margin:7px 0;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(255,255,255,.08);
}


.songItem.active{

    background:rgba(255,255,255,.22);

    border-color:rgba(255,255,255,.40);
}


.songItem span{

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


.songPlay{

    flex-shrink:0;

    border:0;

    border-radius:20px;

    padding:8px 18px;

    cursor:pointer;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .top{

        padding:15px;
    }

    .clock{

        font-size:18px;
    }

    .date{

        font-size:8px;

        letter-spacing:1px;
    }

    .socialBtn{

        width:38px;
        height:38px;

        font-size:17px;
    }

    .topButtons{

        gap:5px;
    }

    h1{

        font-size:50px;

        letter-spacing:-2px;
    }

    .badge{

        font-size:8px;

        letter-spacing:2px;
    }

    .subtitle{

        font-size:8px;

        letter-spacing:3px;
    }

    .player{

        width:97%;

        padding:12px;
    }

    .playerRow{

        gap:7px;
    }

    .playBtn{

        width:44px;

        height:44px;
    }

    .songTitle{

        font-size:13px;
    }

    .navBtn{

        width:36px;

        height:36px;

        font-size:20px;
    }

    .volumeBtn{

        min-width:34px;

        padding:0 6px;

        font-size:10px;
    }

    .volumeBox{

        padding:0 7px;
    }

    .volumeRange{

        width:65px;
    }

}


@media(max-width:450px){

    .volumeBox{

        display:none;
    }

    .volumeControls{

        gap:3px;
    }

    .volumeBtn{

        min-width:32px;

        padding:0 5px;
    }

    .main{

        padding-bottom:160px;
    }

    .socialBtn{

        width:32px;
        height:32px;

        font-size:14px;
    }

    .instagramIcon{

        width:16px;
        height:16px;
    }

    .youtubeIcon{

        width:19px;
        height:14px;
    }

    .whatsappIcon{

        width:17px;
        height:17px;

        font-size:10px;
    }

}

</style>

</head>


<body>

     BACKGROUND
========================= -->

<img

>

     EFFECTS
========================= -->

<div id="effects">

    <div class="light one"></div>

    <div class="light two"></div>

    <div class="light three"></div>

</div>


<div class="page">


<!-- =========================
     TOP
========================= -->

<header class="top">


    <div>

        <div
            class="clock"

     <a

<!-- =========================

<main class="main">

    <h1>

    </h1>


    <div class="subtitle">

        MUSIC • PHOTOGRAPHY • MEMORIES

    </div>

</main>


<!-- =========================
     PLAYER
========================= -->

<div
    class="player"
    id="player">


    <div class="playerRow">


        <button
            class="playBtn"
            id="playBtn"
            onclick="togglePlay()">

            ▶

        </button>


        <div class="songInfo">


            <div class="nowPlaying">

                NOW PLAYING

            </div>


            <div
                class="songTitle"
                id="songTitle">

                Song 1

            </div>

        </div>


        <div class="navButtons">


            <button
                class="navBtn"
                onclick="previousSong()">

                ‹

            </button>


            <button
                class="navBtn"
                onclick="nextSong()">

                ›

            </button>

        </div>


        <!-- VOLUME -->

        <div class="volumeControls">


            <button
                class="volumeBtn"

                <input
                    type="range"
                    class="volumeRange"
                    id="volumeRange"
                    min="0"

                    step="0.01"
                    value="1"
                    oninput="setVolume(this.value)"
                >

</div>

========================= -->

    class="songWindow"
    id="songWindow">


    <div class="songList">


        <button
            class="closeBtn"
            onclick="closeSongs()">

            ✕ CLOSE

        </button>


        <div id="songList"></div>

    </div>

</div>


</div>


<audio id="audio"></audio>


<script>


/* =========================
   30 BACKGROUNDS
========================= */

const backgrounds = [

    "BG (1).jpg",
    "BG (2).jpg",
    "BG (3).jpg",
    "BG (4).jpg",
    "BG (5).jpg",
    "BG (6).jpg",
    "BG (7).jpg",
    "BG (8).jpg",
    "BG (9).jpg",
    "BG (10).jpg",
    "BG (11).jpg",
    "BG (12).jpg",
    "BG (13).jpg",
    "BG (14).jpg",
    "BG (15).jpg",
    "BG (16).jpg",
    "BG (17).jpg",
    "BG (18).jpg",
    "BG (19).jpg",
    "BG (20).jpg",
    "BG (21).jpg",
    "BG (22).jpg",
    "BG (23).jpg",
    "BG (24).jpg",
    "BG (25).jpg",
    "BG (26).jpg",
    "BG (27).jpg",
    "BG (28).jpg",
    "BG (29).jpg",
    "BG (30).jpg"

];


/* =========================
   36 SONGS
========================= */

const songs = [];

for(let i = 1; i <= 36; i++){

    songs.push(
        "song (" + i + ").mp3"
    );

}


/* =========================
   VARIABLES
========================= */

let currentSong = 0;

const audio =
    document.getElementById("audio");

const playBtn =
    document.getElementById("playBtn");

const songTitle =
    document.getElementById("songTitle");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const volumeRange =
    document.getElementById("volumeRange");

const muteBtn =
    document.getElementById("muteBtn");

const backgroundImage =
    document.getElementById("backgroundImage");


/* =========================
   CHANGE BACKGROUND
   SONG KE SAATH
========================= */

function changeBackground(){

    const backgroundIndex =
        currentSong % backgrounds.length;

    const newBackground =
        backgrounds[backgroundIndex];


    backgroundImage.style.opacity = "0";


    const testImage =
        new Image();


    testImage.onload =
        function(){

            backgroundImage.src =
                newBackground;

            backgroundImage.style.opacity =
                "1";

        };


    testImage.onerror =
        function(){

            console.log(
                "Background नहीं मिला:",
                newBackground
            );

            backgroundImage.style.opacity =
                "1";

        };


    testImage.src =
        newBackground;

}


/* =========================
   LOAD SONG
========================= */

function loadSong(){

    audio.src =
        songs[currentSong];

    audio.load();


    songTitle.innerText =
        "Song " + (currentSong + 1);


    progressBar.style.width =
        "0%";


    changeBackground();


    updateSongList();

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay(){

    if(audio.paused){

        audio.play()
        .then(function(){

            playBtn.innerText =
                "❚❚";

        })
        .catch(function(error){

            console.log(
                "Audio play नहीं हो पाया:",
                error
            );

        });

    }
    else{

        audio.pause();

        playBtn.innerText =
            "▶";

    }

}


/* =========================
   NEXT
========================= */

function nextSong(){

    currentSong++;


    if(
        currentSong >=
        songs.length
    ){

        currentSong = 0;

    }


    loadSong();


    audio.play()
    .then(function(){

        playBtn.innerText =
            "❚❚";

    })
    .catch(function(){

        playBtn.innerText =
            "▶";

    });

}


/* =========================
   PREVIOUS
========================= */

function previousSong(){

    currentSong--;


    if(currentSong < 0){

        currentSong =
            songs.length - 1;

    }


    loadSong();


    audio.play()
    .then(function(){

        playBtn.innerText =
            "❚❚";

    })
    .catch(function(){

        playBtn.innerText =
            "▶";

    });

}


/* =========================
   AUTO NEXT
========================= */

audio.addEventListener(
    "ended",
    function(){

        nextSong();

    }
);


/* =========================
   PLAY / PAUSE ICON
========================= */

audio.addEventListener(
    "play",
    function(){

        playBtn.innerText =
            "❚❚";

    }
);


audio.addEventListener(
    "pause",
    function(){

        playBtn.innerText =
            "▶";

    }
);


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
    "timeupdate",
    function(){

        if(
            audio.duration &&
            isFinite(audio.duration)
        ){

            const percent =
                (
                    audio.currentTime /
                    audio.duration
                ) * 100;


            progressBar.style.width =
                percent + "%";

        }

    }
);


/* =========================
   PROGRESS CLICK
========================= */

progress.addEventListener(
    "click",
    function(event){

        if(
            !audio.duration ||
            !isFinite(audio.duration)
        ){

            return;

        }


        const rect =
            progress.getBoundingClientRect();


        const percent =
            (
                event.clientX -
                rect.left
            ) / rect.width;


        audio.currentTime =
            percent *
            audio.duration;

    }
);


/* =========================
   VOLUME
========================= */

function setVolume(value){

    audio.volume =
        Number(value);


    volumeRange.value =
        audio.volume;


    if(audio.volume > 0){

        audio.muted =
            false;


        muteBtn.innerText =
            "🔊";

    }

}


function volumeUp(){

    let value =
        audio.volume + 0.1;


    if(value > 1){

        value = 1;

    }


    setVolume(value);

}


function volumeDown(){

    let value =
        audio.volume - 0.1;


    if(value < 0){

        value = 0;

    }


    setVolume(value);

}


function toggleMute(){

    audio.muted =
        !audio.muted;


    if(audio.muted){

        muteBtn.innerText =
            "🔇";

    }
    else{

        muteBtn.innerText =
            "🔊";

    }

}


/* =========================
   SONG LIST
========================= */

function createSongList(){

    const list =
        document.getElementById(
            "songList"
        );


    list.innerHTML =
        "";


    songs.forEach(
        function(song,index){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "songItem";


            item.innerHTML = `

                <span>
                    🎵 Song ${index + 1}
                </span>

                <button
                    class="songPlay"
                    onclick="selectSong(${index})">

                    ▶ Play

                </button>

            `;


            list.appendChild(item);

        }
    );

}


function updateSongList(){

    const items =
        document.querySelectorAll(
            ".songItem"
        );


    items.forEach(
        function(item,index){

            if(index === currentSong){

                item.classList.add(
                    "active"
                );

            }
            else{

                item.classList.remove(
                    "active"
                );

            }

        }
    );

}


function selectSong(index){

    currentSong =
        index;


    loadSong();


    audio.play()
    .then(function(){

        playBtn.innerText =
            "❚❚";

    })
    .catch(function(){

        playBtn.innerText =
            "▶";

    });


    closeSongs();

}


function openSongs(){

    document
        .getElementById("songWindow")
        .style.display =
        "block";

}


function closeSongs(){

    document
        .getElementById("songWindow")
        .style.display =
        "none";

}


/* =========================
   DATE & TIME
========================= */

function updateDateTime(){

    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            "hi-IN",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",
                hour12:true
            }
        );


    const date =
        now.toLocaleDateString(
            "hi-IN",
            {
                weekday:"long",
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        );


    document
        .getElementById("liveTime")
        .innerText =
        time;


    document
        .getElementById("liveDate")
        .innerText =
        date;

}


updateDateTime();


setInterval(
    updateDateTime,
    1000
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.code === "Space" &&
            event.target.tagName !== "INPUT"
        ){

            event.preventDefault();

            togglePlay();

        }


        if(
            event.code === "ArrowRight" &&
            event.target.tagName !== "INPUT"
        ){

            nextSong();

        }


        if(
            event.code === "ArrowLeft" &&
            event.target.tagName !== "INPUT"
        ){

            previousSong();

        }

    }
);


/* =========================
   SPECIAL EFFECT
========================= */

let specialTimer = null;


function createParticles(){

    const effects =
        document.getElementById(
            "effects"
        );


    effects
        .querySelectorAll(
            ".particle"
        )
        .forEach(
            function(p){

                p.remove();

            }
        );


    for(
        let i = 0;
        i < 45;
        i++
    ){

        const particle =
            document.createElement(
                "div"
            );


        particle.className =
            "particle";


        particle.style.left =
            Math.random() * 100 + "%";


        particle.style.animationDuration =
            (3 + Math.random() * 6) + "s";


        particle.style.animationDelay =
            (-Math.random() * 5) + "s";


        particle.style.width =
            (2 + Math.random() * 5) + "px";


        particle.style.height =
            particle.style.width;


        effects.appendChild(
            particle
        );

    }

}


/* =========================
   START
========================= */

createParticles();

createSongList();

loadSong();

setVolume(1);

</script>

</body>
</html>
