<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTTAM PHOTOGRAPHY</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:#fff;

    background-color:#111;
    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    transition:background-image .8s ease;

    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.50);
    z-index:-1;
}


/* =========================
   TOP
========================= */

.top{
    position:relative;

    padding:22px 30px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    gap:15px;
}

.time{
    font-size:24px;
    font-weight:bold;
}

.date{
    font-size:11px;
    letter-spacing:2px;
    margin-top:5px;
    opacity:.8;
}


/* TOP BUTTONS */

.topButtons{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:10px;
    flex-wrap:wrap;
}

.topBtn{
    border:1px solid rgba(255,255,255,.35);

    background:rgba(20,20,20,.55);

    color:white;

    padding:11px 16px;

    border-radius:25px;

    cursor:pointer;

    font-size:13px;

    font-weight:bold;

    backdrop-filter:blur(15px);

    transition:.2s;
}

.topBtn:hover{
    background:rgba(255,255,255,.18);
    transform:translateY(-2px);
}


/* =========================
   HERO
========================= */

.hero{
    min-height:calc(100vh - 100px);

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    padding:30px 20px 190px;
}

.smallTitle{
    border:1px solid rgba(255,255,255,.35);

    background:rgba(0,0,0,.25);

    padding:10px 28px;

    border-radius:30px;

    font-size:12px;

    letter-spacing:4px;

    margin-bottom:35px;

    backdrop-filter:blur(12px);
}

h1{
    font-family:Georgia,serif;

    font-size:clamp(55px,9vw,125px);

    line-height:.85;

    letter-spacing:-4px;

    background:linear-gradient(
        180deg,
        #ffffff,
        #d9d9d9,
        #ffffff,
        #999999
    );

    -webkit-background-clip:text;

    color:transparent;

    text-shadow:0 5px 25px rgba(0,0,0,.7);
}

.sub{
    margin-top:30px;

    letter-spacing:7px;

    font-size:12px;

    opacity:.8;
}


/* =========================
   PLAYER
========================= */

.player{
    position:fixed;

    bottom:15px;
    left:50%;

    transform:translateX(-50%);

    width:min(920px,94%);

    padding:16px 20px;

    border:1px solid rgba(255,255,255,.35);

    border-radius:25px;

    background:rgba(20,20,20,.55);

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    box-shadow:0 10px 40px rgba(0,0,0,.55);

    z-index:10;
}

.playerTop{
    display:flex;

    align-items:center;

    gap:15px;
}

.play{
    width:52px;
    height:52px;

    border-radius:50%;

    border:2px solid white;

    background:rgba(255,255,255,.08);

    color:white;

    font-size:20px;

    cursor:pointer;

    flex-shrink:0;
}

.play:hover{
    background:rgba(255,255,255,.2);
}

.info{
    flex:1;

    min-width:0;

    text-align:left;
}

.now{
    font-size:9px;

    letter-spacing:3px;

    opacity:.55;

    margin-bottom:5px;
}

.songName{
    font-size:17px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.buttons{
    display:flex;

    gap:8px;

    align-items:center;
}

.nextBtn{
    width:42px;
    height:42px;

    border:1px solid rgba(255,255,255,.25);

    border-radius:50%;

    background:rgba(255,255,255,.08);

    color:white;

    font-size:25px;

    cursor:pointer;
}

.nextBtn:hover{
    background:rgba(255,255,255,.2);
}


/* =========================
   PROGRESS
========================= */

.progress{
    width:100%;

    margin-top:13px;

    height:6px;

    border-radius:10px;

    background:rgba(255,255,255,.25);

    cursor:pointer;

    overflow:hidden;
}

.progressBar{
    height:100%;

    width:0%;

    border-radius:10px;

    background:#fff;

    transition:width .1s linear;
}


/* =========================
   EXTRA CONTROLS
========================= */

.extraControls{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    margin-top:13px;

    flex-wrap:wrap;
}

.controlBtn{
    border:1px solid rgba(255,255,255,.3);

    background:rgba(255,255,255,.08);

    color:white;

    border-radius:20px;

    padding:8px 12px;

    cursor:pointer;

    font-size:13px;

    white-space:nowrap;

    transition:.2s;
}

.controlBtn:hover{
    background:rgba(255,255,255,.18);
}


/* VOLUME */

.volumeWrap{
    display:flex;

    align-items:center;

    gap:7px;

    padding:5px 11px;

    border:1px solid rgba(255,255,255,.25);

    background:rgba(0,0,0,.25);

    border-radius:22px;
}

.volumeIcon{
    font-size:14px;
}

.volume{
    width:135px;

    height:5px;

    cursor:pointer;

    accent-color:white;
}


/* =========================
   SONG LIST
========================= */

.songs{
    display:none;

    position:fixed;

    inset:0;

    z-index:20;

    background:rgba(0,0,0,.88);

    backdrop-filter:blur(15px);

    padding:40px 20px;

    overflow:auto;
}

.songList{
    max-width:700px;

    margin:auto;
}

.close{
    display:block;

    margin:0 auto 25px;

    background:white;

    color:#111;

    border:0;

    padding:10px 25px;

    border-radius:20px;

    cursor:pointer;

    font-weight:bold;
}

.songItem{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    padding:14px 18px;

    margin:8px 0;

    border-radius:15px;

    background:rgba(255,255,255,.10);

    border:1px solid rgba(255,255,255,.1);
}

.songItem.active{
    background:rgba(255,255,255,.22);
}

.songItem span{
    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.songItem button{
    border:0;

    border-radius:20px;

    padding:8px 18px;

    cursor:pointer;

    flex-shrink:0;
}


/* =========================
   FULLSCREEN
========================= */

#playerBox:fullscreen{
    width:100%;
    height:100%;

    border-radius:0;

    bottom:auto;
    left:auto;

    transform:none;

    display:flex;
    flex-direction:column;

    justify-content:center;

    padding:40px;

    background:rgba(10,10,10,.95);
}

#playerBox:fullscreen .playerTop{
    max-width:900px;
    width:100%;
    margin:auto;
}

#playerBox:fullscreen .progress,
#playerBox:fullscreen .extraControls{
    max-width:900px;
    width:100%;
    margin-left:auto;
    margin-right:auto;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .top{
        padding:16px;
    }

    .time{
        font-size:18px;
    }

    .date{
        font-size:9px;
        letter-spacing:1px;
    }

    .topButtons{
        gap:6px;
    }

    .topBtn{
        padding:9px 10px;
        font-size:10px;
    }

    h1{
        font-size:48px;
        letter-spacing:-2px;
    }

    .smallTitle{
        font-size:9px;
        letter-spacing:2px;
        padding:9px 15px;
    }

    .sub{
        font-size:9px;
        letter-spacing:4px;
    }

    .player{
        bottom:8px;

        width:96%;

        padding:13px;
    }

    .songName{
        font-size:14px;
    }

    .play{
        width:46px;
        height:46px;
    }

    .nextBtn{
        width:38px;
        height:38px;
    }

    .extraControls{
        gap:6px;
    }

    .controlBtn{
        padding:7px 9px;
        font-size:11px;
    }

    .volumeWrap{
        padding:5px 8px;
    }

    .volume{
        width:90px;
    }

}


/* VERY SMALL SCREEN */

@media(max-width:380px){

    .top{
        align-items:center;
    }

    .date{
        display:none;
    }

    .topBtn{
        font-size:9px;
        padding:8px;
    }

    .volume{
        width:75px;
    }

}
</style>
</head>


<body>


<!-- =========================
     TOP
========================= -->

<div class="top">

    <div>

        <div
            class="time"
            id="clock">
            00:00:00
        </div>

        <div
            class="date"
            id="date">
        </div>

    </div>


    <div class="topButtons">

        <button
            class="topBtn"
            onclick="openSongs()">

            🎵 ALL SONGS

        </button>


        <button
            class="topBtn"
            onclick="toggleFullscreen()">

            ⛶ FULL SCREEN

        </button>

    </div>

</div>


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <div class="smallTitle">

        📸 &nbsp;
        U T T A M &nbsp;
        P H O T O G R A P H Y

    </div>


    <h1>

        UTTAM<br>
        PHOTOGRAPHY

    </h1>


    <div class="sub">

        MUSIC • PHOTOGRAPHY • MEMORIES

    </div>

</section>


<!-- =========================
     MUSIC PLAYER
========================= -->

<div
    class="player"
    id="playerBox">


    <div class="playerTop">


        <button
            class="play"
            id="playBtn"
            onclick="togglePlay()">

            ▶

        </button>


        <div class="info">

            <div class="now">

                NOW PLAYING

            </div>


            <div
                class="songName"
                id="songName">

                Song 1

            </div>

        </div>


        <div class="buttons">

            <button
                class="nextBtn"
                onclick="previousSong()">

                ‹

            </button>


            <button
                class="nextBtn"
                onclick="nextSong()">

                ›

            </button>

        </div>

    </div>


    <!-- PROGRESS BAR -->

    <div
        class="progress"
        onclick="seek(event)">

        <div
            class="progressBar"
            id="progressBar">
        </div>

    </div>


    <!-- CONTROLS -->

    <div class="extraControls">


        <button
            class="controlBtn"
            onclick="toggleMute()"
            id="muteBtn">

            🔊 Mute

        </button>


        <button
            class="controlBtn"
            onclick="changeVolume(-0.1)">

            🔉 −

        </button>


        <div class="volumeWrap">

            <span class="volumeIcon">
                🔊
            </span>


            <input
                class="volume"
                id="volumeControl"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1"
                oninput="setVolume(this.value)">

        </div>


        <button
            class="controlBtn"
            onclick="changeVolume(0.1)">

            🔊 +

        </button>

    </div>

</div>


<!-- =========================
     SONG LIST
========================= -->

<div
    class="songs"
    id="songsBox">


    <div class="songList">


        <button
            class="close"
            onclick="closeSongs()">

            ✕ CLOSE

        </button>


        <div id="songList"></div>


    </div>

</div>


<!-- AUDIO -->

<audio id="audio"></audio>


<script>


/* =========================
   36 SONGS
========================= */

const songs = [];

for(let i = 1; i <= 36; i++){

    songs.push(
        "song (" + i + ").mp3"
    );

}


/* =========================
   BACKGROUNDS
========================= */

const backgrounds = [

    "background  (1).jpg",
    "background  (2).jpg",
    "background  (3).jpg",
    "background  (4).jpg",
    "background  (5).jpg"

];


let currentSong = 0;


const audio =
    document.getElementById("audio");


const songName =
    document.getElementById("songName");


const playBtn =
    document.getElementById("playBtn");


const progressBar =
    document.getElementById("progressBar");


const volumeControl =
    document.getElementById("volumeControl");


const muteBtn =
    document.getElementById("muteBtn");


/* =========================
   BACKGROUND
========================= */

function changeBackground(){

    const bg =
        backgrounds[
            currentSong %
            backgrounds.length
        ];


    document.body.style.backgroundImage =
        "url('" + bg + "')";

}


/* =========================
   LOAD SONG
========================= */

function loadSong(){

    audio.src =
        songs[currentSong];


    audio.load();


    songName.innerText =
        "Song " +
        (currentSong + 1);


    changeBackground();


    progressBar.style.width =
        "0%";


    updateSongList();

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay(){

    if(audio.paused){

        audio.play()
        .then(function(){

            playBtn.innerText =
                "❚❚";

        })
        .catch(function(){

            alert(
                "Play करने के लिए Play button दबाएँ।"
            );

        });

    }
    else{

        audio.pause();

        playBtn.innerText =
            "▶";

    }

}


/* =========================
   NEXT SONG
========================= */

function nextSong(){

    currentSong++;


    if(
        currentSong >=
        songs.length
    ){

        currentSong = 0;

    }


    loadSong();


    audio.play()
    .then(function(){

        playBtn.innerText =
            "❚❚";

    })
    .catch(function(){

        playBtn.innerText =
            "▶";

    });

}


/* =========================
   PREVIOUS SONG
========================= */

function previousSong(){

    currentSong--;


    if(currentSong < 0){

        currentSong =
            songs.length - 1;

    }


    loadSong();


    audio.play()
    .then(function(){

        playBtn.innerText =
            "❚❚";

    })
    .catch(function(){

        playBtn.innerText =
            "▶";

    });

}


/* =========================
   AUTO NEXT
========================= */

audio.addEventListener(
    "ended",
    function(){

        nextSong();

    }
);


/* =========================
   PLAY STATE
========================= */

audio.addEventListener(
    "play",
    function(){

        playBtn.innerText =
            "❚❚";

    }
);


audio.addEventListener(
    "pause",
    function(){

        playBtn.innerText =
            "▶";

    }
);


/* =========================
   PROGRESS
========================= */

audio.addEventListener(
    "timeupdate",
    function(){

        if(
            audio.duration &&
            isFinite(audio.duration)
        ){

            const percent =
                (
                    audio.currentTime /
                    audio.duration
                ) * 100;


            progressBar.style.width =
                percent + "%";

        }

    }
);


/* =========================
   SEEK
========================= */

function seek(event){

    if(
        !audio.duration ||
        !isFinite(audio.duration)
    ){

        return;

    }


    const rect =
        event.currentTarget
        .getBoundingClientRect();


    const percent =
        (
            event.clientX -
            rect.left
        ) / rect.width;


    audio.currentTime =
        percent *
        audio.duration;

}


/* =========================
   VOLUME
========================= */

function setVolume(value){

    audio.volume =
        Number(value);


    volumeControl.value =
        audio.volume;


    if(
        audio.volume > 0
    ){

        audio.muted =
            false;


        muteBtn.innerText =
            "🔊 Mute";

    }

}


/* =========================
   VOLUME + / -
========================= */

function changeVolume(amount){

    let volume =
        audio.volume +
        amount;


    volume =
        Math.max(
            0,
            Math.min(
                1,
                volume
            )
        );


    setVolume(volume);

}


/* =========================
   MUTE
========================= */

function toggleMute(){

    audio.muted =
        !audio.muted;


    if(audio.muted){

        muteBtn.innerText =
            "🔇 Unmute";

    }
    else{

        muteBtn.innerText =
            "🔊 Mute";

    }

}


/* =========================
   FULL SCREEN
========================= */

function toggleFullscreen(){

    const player =
        document.getElementById(
            "playerBox"
        );


    if(
        !document.fullscreenElement
    ){

        if(
            player.requestFullscreen
        ){

            player.requestFullscreen();

        }
        else if(
            player.webkitRequestFullscreen
        ){

            player.webkitRequestFullscreen();

        }

    }
    else{

        if(
            document.exitFullscreen
        ){

            document.exitFullscreen();

        }

    }

}


/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.code === "Space" &&
            event.target.tagName !== "INPUT"
        ){

            event.preventDefault();

            togglePlay();

        }


        if(
            event.code === "ArrowRight" &&
            event.target.tagName !== "INPUT"
        ){

            nextSong();

        }


        if(
            event.code === "ArrowLeft" &&
            event.target.tagName !== "INPUT"
        ){

            previousSong();

        }


        if(
            event.key.toLowerCase() === "m" &&
            event.target.tagName !== "INPUT"
        ){

            toggleMute();

        }

    }
);


/* =========================
   SONG LIST
========================= */

function createSongList(){

    const list =
        document.getElementById(
            "songList"
        );


    list.innerHTML = "";


    songs.forEach(
        function(song,index){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "songItem";


            item.innerHTML = `

                <span>
                    🎵 Song ${index + 1}
                </span>

                <button
                    onclick="selectSong(${index})">

                    ▶ Play

                </button>

            `;


            list.appendChild(item);

        }
    );

}


/* =========================
   UPDATE SONG LIST
========================= */

function updateSongList(){

    const items =
        document.querySelectorAll(
            ".songItem"
        );


    items.forEach(
        function(item,index){

            if(
                index === currentSong
            ){

                item.classList.add(
                    "active"
                );

            }
            else{

                item.classList.remove(
                    "active"
                );

            }

        }
    );

}


/* =========================
   SELECT SONG
========================= */

function selectSong(index){

    currentSong =
        index;


    loadSong();


    audio.play()
    .then(function(){

        playBtn.innerText =
            "❚❚";

    })
    .catch(function(){

        playBtn.innerText =
            "▶";

    });


    closeSongs();

}


/* =========================
   SONG WINDOW
========================= */

function openSongs(){

    document
        .getElementById("songsBox")
        .style.display =
        "block";


    updateSongList();

}


function closeSongs(){

    document
        .getElementById("songsBox")
        .style.display =
        "none";

}


/* =========================
   CLOCK
========================= */

function updateClock(){

    const now =
        new Date();


    let hours =
        now.getHours();


    const minutes =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const seconds =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    const ampm =
        hours >= 12
        ? "PM"
        : "AM";


    hours =
        hours % 12 || 12;


    document
        .getElementById("clock")
        .innerText =

        String(hours)
        .padStart(2,"0")

        + ":" +

        minutes

        + ":" +

        seconds

        + " " +

        ampm;


    document
        .getElementById("date")
        .innerText =

        now.toLocaleDateString(
            "en-IN",
            {
                weekday:"long",
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        ).toUpperCase();

}


updateClock();


setInterval(
    updateClock,
    1000
);


/* =========================
   START WEBSITE
========================= */

createSongList();

loadSong();

setVolume(1);

</script>

</body>
</html>
