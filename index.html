<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MY MUSIC</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.78)),
    url("background.png") center/cover fixed;
}

/* TOP */
.top{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 30px;
}

.time{
    font-size:24px;
    font-weight:bold;
    text-shadow:0 2px 10px #000;
}

.date{
    font-size:12px;
    opacity:.8;
    margin-top:5px;
}

.top button{
    background:rgba(0,0,0,.55);
    color:white;
    border:1px solid rgba(255,255,255,.3);
    padding:10px 18px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
}

/* MAIN */
.main{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:100px 20px 180px;
}

.content{
    width:100%;
    max-width:850px;
}

.logo{
    width:85px;
    height:85px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#111;
    border:3px solid #e7b94e;
    box-shadow:0 0 30px rgba(0,0,0,.8);
    font-size:35px;
}

.tag{
    display:inline-block;
    margin-top:25px;
    padding:8px 18px;
    border:1px solid rgba(255,255,255,.3);
    border-radius:30px;
    background:rgba(0,0,0,.35);
    font-size:12px;
    letter-spacing:2px;
}

h1{
    font-family:Georgia,serif;
    font-size:clamp(60px,10vw,120px);
    line-height:.85;
    margin:25px 0 15px;
    text-shadow:0 6px 20px black;
}

.subtitle{
    letter-spacing:5px;
    font-size:14px;
    opacity:.8;
}

/* PLAYER */
.player{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    width:min(760px,calc(100% - 30px));
    background:rgba(15,12,10,.88);
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    padding:13px 16px;
    box-shadow:0 15px 50px rgba(0,0,0,.7);
    backdrop-filter:blur(15px);
}

.player-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.play{
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.song-info{
    flex:1;
    min-width:0;
}

.now{
    font-size:10px;
    letter-spacing:2px;
    opacity:.6;
}

.song-title{
    font-weight:bold;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.control{
    border:0;
    background:transparent;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.progress{
    width:100%;
    margin-top:10px;
    cursor:pointer;
}

/* SONG LIST */
.list{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    overflow:auto;
    background:rgba(10,8,7,.97);
    padding:90px 20px 130px;
}

.list.show{
    display:block;
}

.list-box{
    width:min(850px,100%);
    margin:auto;
}

.list h2{
    font-size:32px;
}

.close{
    float:right;
    background:transparent;
    color:white;
    border:1px solid white;
    border-radius:20px;
    padding:8px 15px;
    cursor:pointer;
}

.song{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:14px 16px;
    margin:8px 0;
    border-radius:14px;
    background:rgba(255,255,255,.09);
}

.song.active{
    background:rgba(255,255,255,.22);
}

.song button{
    border:0;
    border-radius:20px;
    padding:9px 16px;
    cursor:pointer;
    font-weight:bold;
}

/* MOBILE */
@media(max-width:600px){

    .top{
        padding:14px;
    }

    .time{
        font-size:18px;
    }

    .top button{
        padding:8px 12px;
        font-size:12px;
    }

    h1{
        font-size:60px;
    }

    .subtitle{
        font-size:10px;
        letter-spacing:3px;
    }

    .player{
        bottom:10px;
    }
}
</style>
</head>

<body>

<!-- TOP -->
<div class="top">

    <div>
        <div class="time" id="time">11:00 AM</div>
        <div class="date" id="date"></div>
    </div>

    <button onclick="openSongs()">🎵 ALL SONGS</button>

</div>


<!-- MAIN -->
<div class="main">

    <div class="content">

        <div class="logo">▶</div>

        <div class="tag">
            NOW PLAYING • MY MUSIC
        </div>

        <h1>
            MY<br>
            MUSIC
        </h1>

        <div class="subtitle">
            YOUR PERSONAL MUSIC STATION
        </div>

    </div>

</div>


<!-- PLAYER -->
<div class="player">

    <div class="player-row">

        <button class="play" id="playButton" onclick="playPause()">
            ▶
        </button>

        <div class="song-info">

            <div class="now">
                NOW PLAYING
            </div>

            <div class="song-title" id="songTitle">
                Song 1
            </div>

        </div>

        <button class="control" onclick="previousSong()">
            ‹
        </button>

        <button class="control" onclick="nextSong()">
            ›
        </button>

    </div>

    <input
        class="progress"
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
    >

    <audio id="audio"></audio>

</div>


<!-- SONG LIST -->
<div class="list" id="songList">

    <div class="list-box">

        <button class="close" onclick="closeSongs()">
            ✕ CLOSE
        </button>

        <h2>🎵 MY SONGS</h2>

        <div id="songs"></div>

    </div>

</div>


<script>

/* SONGS */

const songs = [];

for(let i=1;i<=35;i++){

    songs.push({
        name:"Song " + i,
        file:"song (" + i + ").mp3"
    });

}


/* PLAYER */

let current = 0;

const audio =
document.getElementById("audio");

const title =
document.getElementById("songTitle");

const playButton =
document.getElementById("playButton");

const progress =
document.getElementById("progress");


/* LOAD SONG */

function loadSong(index,auto=false){

    current = index;

    audio.src = songs[current].file;

    title.innerText =
    "🎵 " + songs[current].name;

    progress.value = 0;

    updateList();

    if(auto){

        audio.play().catch(()=>{});

    }

}


/* PLAY / PAUSE */

function playPause(){

    if(audio.paused){

        audio.play().catch(()=>{});

    }else{

        audio.pause();

    }

}


/* PLAY BUTTON */

audio.addEventListener("play",function(){

    playButton.innerText="❚❚";

});


audio.addEventListener("pause",function(){

    playButton.innerText="▶";

});


/* AUTOMATIC NEXT SONG */

audio.addEventListener("ended",function(){

    current++;

    if(current >= songs.length){

        current=0;

    }

    loadSong(current,true);

});


/* NEXT */

function nextSong(){

    current++;

    if(current >= songs.length){

        current=0;

    }

    loadSong(current,true);

}


/* PREVIOUS */

function previousSong(){

    current--;

    if(current < 0){

        current=songs.length-1;

    }

    loadSong(current,true);

}


/* PROGRESS */

audio.addEventListener("timeupdate",function(){

    if(audio.duration){

        progress.value =
        (audio.currentTime/audio.duration)*100;

    }

});


progress.addEventListener("input",function(){

    if(audio.duration){

        audio.currentTime =
        (progress.value/100)*audio.duration;

    }

});


/* SONG LIST */

function createList(){

    const box =
    document.getElementById("songs");

    box.innerHTML="";

    songs.forEach(function(song,index){

        const item =
        document.createElement("div");

        item.className="song";

        item.innerHTML=`

            <span>
                🎵 ${song.name}
            </span>

            <button onclick="loadSong(${index},true)">
                ▶ PLAY
            </button>

        `;

        box.appendChild(item);

    });

}


function updateList(){

    const items =
    document.querySelectorAll(".song");

    items.forEach(function(item,index){

        if(index===current){

            item.classList.add("active");

        }else{

            item.classList.remove("active");

        }

    });

}


/* OPEN / CLOSE */

function openSongs(){

    document
    .getElementById("songList")
    .classList.add("show");

    updateList();

}


function closeSongs(){

    document
    .getElementById("songList")
    .classList.remove("show");

}


/* DATE + TIME */

function updateTime(){

    const now=new Date();

    document.getElementById("time").innerText =
    now.toLocaleTimeString("en-IN",{
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
    });

    document.getElementById("date").innerText =
    now.toLocaleDateString("en-IN",{
        weekday:"long",
        day:"2-digit",
        month:"long",
        year:"numeric"
    }).toUpperCase();

}


/* START */

createList();

loadSong(0,false);

updateTime();

setInterval(updateTime,1000);

</script>

</body>
</html>
