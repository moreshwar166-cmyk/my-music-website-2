<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Music</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.75)),
                url("background.jpg") center/cover fixed;
}

.container {
    width: 90%;
    max-width: 800px;
    margin: auto;
    padding: 30px 0;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 38px;
    margin: 10px 0;
}

.date-time {
    background: rgba(0,0,0,.55);
    border-radius: 15px;
    padding: 12px;
    margin-bottom: 25px;
    text-align: center;
}

#liveDate {
    font-size: 18px;
}

#liveTime {
    font-size: 28px;
    font-weight: bold;
    margin-top: 5px;
}

.now-playing {
    background: rgba(255,255,255,.12);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
}

#song-title {
    font-size: 22px;
    margin-bottom: 15px;
}

audio {
    width: 100%;
}

.song {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,.12);
    margin: 10px 0;
    padding: 14px 18px;
    border-radius: 14px;
}

.song span {
    font-size: 17px;
}

.song button {
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    font-size: 20px;
    cursor: pointer;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 15px;
}

.controls button {
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 16px;
}

@media (max-width: 600px) {
    .header h1 {
        font-size: 28px;
    }

    .container {
        width: 94%;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎵 MY MUSIC 🎵</h1>
    </div>

    <div class="date-time">
        <div id="liveDate">Date</div>
        <div id="liveTime">Time</div>
    </div>

    <div class="now-playing">
        <div id="song-title">Song 1</div>

        <audio id="audio" controls></audio>

        <div class="controls">
            <button onclick="previousSong()">⏮️ Previous</button>
            <button onclick="nextSong()">⏭️ Next</button>
        </div>
    </div>

    <div id="playlist"></div>

</div>

<script>

const songs = [
    { title: "Song 1", src: "song (1).mp3" },
    { title: "Song 2", src: "song (2).mp3" },
    { title: "Song 3", src: "song (3).mp3" },
    { title: "Song 4", src: "song (4).mp3" },
    { title: "Song 5", src: "song (5).mp3" },
    { title: "Song 6", src: "song (6).mp3" },
    { title: "Song 7", src: "song (7).mp3" },
    { title: "Song 8", src: "song (8).mp3" },
    { title: "Song 9", src: "song (9).mp3" }
];

let currentSong = 0;

const audio = document.getElementById("audio");
const title = document.getElementById("song-title");
const playlist = document.getElementById("playlist");


// SONG PLAY FUNCTION
function playSong(index, autoPlay = true) {

    currentSong = index;

    audio.src = songs[index].src;
    title.textContent = "🎵 " + songs[index].title;

    if (autoPlay) {
        audio.play().catch(error => {
            console.log("Play button दबाकर गाना शुरू करें।");
        });
    }
}


// AUTOMATIC NEXT SONG
audio.addEventListener("ended", function() {

    currentSong++;

    if (currentSong >= songs.length) {
        currentSong = 0;
    }

    playSong(currentSong, true);
});


// NEXT BUTTON
function nextSong() {

    currentSong++;

    if (currentSong >= songs.length) {
        currentSong = 0;
    }

    playSong(currentSong, true);
}


// PREVIOUS BUTTON
function previousSong() {

    currentSong--;

    if (currentSong < 0) {
        currentSong = songs.length - 1;
    }

    playSong(currentSong, true);
}


// CREATE PLAYLIST
songs.forEach((song, index) => {

    const div = document.createElement("div");

    div.className = "song";

    div.innerHTML = `
        <span>🎵 ${song.title}</span>
        <button onclick="playSong(${index}, true)">▶️</button>
    `;

    playlist.appendChild(div);
});


// FIRST SONG
playSong(0, false);


// LIVE DATE & TIME
function updateDateTime() {

    const now = new Date();

    const date = now.toLocaleDateString("hi-IN", {
        day: "2-digit",
        month: "long",
        year: "numeric"
    });

    const time = now.toLocaleTimeString("hi-IN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    });

    document.getElementById("liveDate").textContent = "📅 " + date;
    document.getElementById("liveTime").textContent = "🕐 " + time;
}

updateDateTime();

setInterval(updateDateTime, 1000);

</script>

</body>
</html>
