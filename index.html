<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTTAM PHOTOGRAPHY - MY MUSIC</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    color:white;
    overflow-x:hidden;
    background:#111;
}

/* =========================
   BACKGROUND IMAGE
========================= */

#backgroundImage{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:0;
    opacity:1;
    transition:opacity .7s ease;
}

/* DARK OVERLAY */

#backgroundDark{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;

    background:
        linear-gradient(
            rgba(0,0,0,.25),
            rgba(0,0,0,.60)
        );
}

/* =========================
   EFFECTS
========================= */

#effects{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:2;
    opacity:0;
    transition:opacity .5s;
}

#effects.active{
    opacity:1;
}

.light{
    position:absolute;
    width:250px;
    height:250px;
    border-radius:50%;
    filter:blur(55px);
    opacity:.55;

    animation:
        moveLight
        5s infinite alternate ease-in-out;
}

.light.one{
    background:#8b5cf6;
    left:5%;
    top:15%;
}

.light.two{
    background:#ec4899;
    right:5%;
    top:30%;
    animation-delay:1s;
}

.light.three{
    background:#06b6d4;
    left:35%;
    bottom:5%;
    animation-delay:2s;
}

@keyframes moveLight{

    0%{
        transform:
            translate(0,0)
            scale(.8);
    }

    100%{
        transform:
            translate(150px,-80px)
            scale(1.3);
    }

}

/* PARTICLES */

.particle{
    position:absolute;
    width:5px;
    height:5px;
    background:white;
    border-radius:50%;

    box-shadow:
        0 0 10px white,
        0 0 20px white;

    animation:
        particleMove
        linear
        infinite;
}

@keyframes particleMove{

    from{
        transform:
            translateY(110vh)
            rotate(0deg);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    85%{
        opacity:1;
    }

    to{
        transform:
            translateY(-20vh)
            rotate(360deg);
        opacity:0;
    }

}

/* =========================
   PAGE
========================= */

.page{
    position:relative;
    z-index:5;
    min-height:100vh;
}

/* =========================
   TOP
========================= */

.top{
    width:100%;
    padding:22px 30px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
}

.clock{
    font-size:25px;
    font-weight:bold;
    letter-spacing:1px;

    text-shadow:
        0 3px 15px black;
}

.date{
    margin-top:5px;
    font-size:11px;
    letter-spacing:2px;
    opacity:.8;

    text-shadow:
        0 2px 10px black;
}

/* =========================
   TOP BUTTONS
========================= */

.topButtons{
    display:flex;
    gap:10px;
}

.topBtn{
    border:
        1px solid
        rgba(255,255,255,.3);

    background:
        rgba(0,0,0,.45);

    color:white;

    padding:
        11px 16px;

    border-radius:25px;
    cursor:pointer;

    font-size:12px;
    font-weight:bold;

    backdrop-filter:
        blur(12px);

    transition:.25s;
}

.topBtn:hover{
    background:
        rgba(255,255,255,.18);

    transform:
        translateY(-2px);
}

.specialBtn{
    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #ec4899
        );

    border:none;
}

/* =========================
   MAIN
========================= */

.main{
    min-height:
        calc(100vh - 100px);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        30px 20px 180px;
}

.badge{
    padding:
        10px 25px;

    border:
        1px solid
        rgba(255,255,255,.3);

    border-radius:30px;

    background:
        rgba(0,0,0,.3);

    backdrop-filter:
        blur(10px);

    font-size:11px;
    letter-spacing:4px;
    margin-bottom:30px;
}

h1{
    font-family:Georgia, serif;

    font-size:
        clamp(50px,9vw,120px);

    line-height:.88;
    letter-spacing:-4px;

    text-shadow:
        0 5px 30px
        rgba(0,0,0,.9);
}

.subtitle{
    margin-top:28px;
    font-size:11px;
    letter-spacing:6px;
    opacity:.8;
}

/* =========================
   PLAYER
========================= */

.player{
    position:fixed;

    left:50%;
    bottom:15px;

    transform:
        translateX(-50%);

    width:
        min(1100px,95%);

    padding:
        15px 20px;

    border:
        1px solid
        rgba(255,255,255,.25);

    border-radius:24px;

    background:
        rgba(10,10,10,.72);

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.65);

    z-index:100;
}

.playerRow{
    display:flex;
    align-items:center;
    gap:12px;
}

.playBtn{
    width:52px;
    height:52px;
    flex-shrink:0;

    border:
        2px solid white;

    border-radius:50%;

    background:
        rgba(255,255,255,.06);

    color:white;

    font-size:19px;
    cursor:pointer;
}

.playBtn:hover{
    background:
        rgba(255,255,255,.18);
}

.songInfo{
    flex:1;
    min-width:0;
}

.nowPlaying{
    font-size:9px;
    letter-spacing:3px;
    opacity:.55;
    margin-bottom:4px;
}

.songTitle{
    font-size:16px;
    font-weight:bold;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.navButtons{
    display:flex;
    gap:7px;
}

.navBtn{
    width:42px;
    height:42px;

    border-radius:50%;

    border:
        1px solid
        rgba(255,255,255,.3);

    background:
        rgba(255,255,255,.07);

    color:white;

    font-size:22px;
    cursor:pointer;
}

.navBtn:hover{
    background:
        rgba(255,255,255,.2);
}

/* =========================
   VOLUME
========================= */

.volumeControls{
    display:flex;
    align-items:center;
    gap:6px;
}

.volumeBtn{
    height:36px;
    min-width:42px;

    padding:
        0 9px;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.28);

    background:
        rgba(255,255,255,.07);

    color:white;
    cursor:pointer;
}

.volumeBox{
    height:36px;

    padding:
        0 10px;

    display:flex;
    align-items:center;
    gap:7px;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.3);
}

.volumeRange{
    width:100px;
    cursor:pointer;
}

/* =========================
   PROGRESS
========================= */

.progress{
    width:100%;
    height:6px;

    margin-top:13px;

    background:
        rgba(255,255,255,.25);

    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
}

.progressBar{
    width:0%;
    height:100%;
    background:white;
}

/* =========================
   SONG WINDOW
========================= */

.songWindow{
    display:none;

    position:fixed;
    inset:0;

    z-index:500;

    padding:
        35px 20px;

    overflow-y:auto;

    background:
        rgba(0,0,0,.94);

    backdrop-filter:
        blur(15px);
}

.songList{
    width:
        min(700px,100%);

    margin:auto;
}

.closeBtn{
    display:block;

    margin:
        0 auto 20px;

    padding:
        10px 25px;

    border:0;
    border-radius:25px;

    background:white;
    color:black;

    font-weight:bold;
    cursor:pointer;
}

.songItem{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding:
        13px 17px;

    margin:7px 0;

    border-radius:14px;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.08);
}

.songItem.active{
    background:
        rgba(255,255,255,.22);
}

.songItem span{
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.songPlay{
    border:0;
    border-radius:20px;

    padding:
        8px 18px;

    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .top{
        padding:15px;
    }

    .clock{
        font-size:18px;
    }

    .date{
        font-size:8px;
    }

    .topBtn{
        padding:
            9px 10px;

        font-size:9px;
    }

    h1{
        font-size:50px;
        letter-spacing:-2px;
    }

    .badge{
        font-size:8px;
        letter-spacing:2px;
    }

    .subtitle{
        font-size:8px;
        letter-spacing:3px;
    }

    .player{
        width:97%;
        padding:12px;
    }

    .playerRow{
        gap:7px;
    }

    .playBtn{
        width:44px;
        height:44px;
    }

    .songTitle{
        font-size:13px;
    }

    .navBtn{
        width:36px;
        height:36px;
    }

    .volumeRange{
        width:65px;
    }

}

@media(max-width:450px){

    .volumeBox{
        display:none;
    }

}

</style>
</head>

<body>

<!-- =========================
     BACKGROUND
========================= -->

<img
    id="backgroundImage"
    src="bg1.%20jpg"
    alt="Background"
>

<div id="backgroundDark"></div>

<!-- EFFECTS -->

<div id="effects">

    <div class="light one"></div>
    <div class="light two"></div>
    <div class="light three"></div>

</div>

<div class="page">

<!-- =========================
     TOP
========================= -->

<header class="top">

    <div>

        <div
            class="clock"
            id="liveTime">

            00:00:00

        </div>

        <div
            class="date"
            id="liveDate">

        </div>

    </div>

    <div class="topButtons">

        <button
            class="topBtn"
            onclick="openSongs()">

            🎵 ALL SONGS

        </button>

        <button
            class="topBtn specialBtn"
            onclick="startSpecialEffect()">

            ✨ SPECIAL

        </button>

    </div>

</header>

<!-- =========================
     MAIN
========================= -->

<main class="main">

    <div class="badge">

        📸 U T T A M &nbsp; P H O T O G R A P H Y

    </div>

    <h1>

        UTTAM<br>
        PHOTOGRAPHY

    </h1>

    <div class="subtitle">

        MUSIC • PHOTOGRAPHY • MEMORIES

    </div>

</main>

<!-- =========================
     PLAYER
========================= -->

<div class="player">

    <div class="playerRow">

        <button
            class="playBtn"
            id="playBtn"
            onclick="togglePlay()">

            ▶

        </button>

        <div class="songInfo">

            <div class="nowPlaying">
                NOW PLAYING
            </div>

            <div
                class="songTitle"
                id="songTitle">

                Song 1

            </div>

        </div>

        <div class="navButtons">

            <button
                class="navBtn"
                onclick="previousSong()">

                ‹

            </button>

            <button
                class="navBtn"
                onclick="nextSong()">

                ›

            </button>

        </div>

        <div class="volumeControls">

            <button
                class="volumeBtn"
                id="muteBtn"
                onclick="toggleMute()">

                🔊

            </button>

            <button
                class="volumeBtn"
                onclick="volumeDown()">

                −

            </button>

            <div class="volumeBox">

                🔊

                <input
                    class="volumeRange"
                    id="volumeRange"
                    type="range"
                    min="0"
                    max="1"
                    step=".01"
                    value="1"
                    oninput="setVolume(this.value)"
                >

            </div>

            <button
                class="volumeBtn"
                onclick="volumeUp()">

                +

            </button>

        </div>

    </div>

    <div
        class="progress"
        id="progress">

        <div
            class="progressBar"
            id="progressBar">
        </div>

    </div>

</div>

<!-- =========================
     SONG WINDOW
========================= -->

<div
    class="songWindow"
    id="songWindow">

    <div class="songList">

        <button
            class="closeBtn"
            onclick="closeSongs()">

            ✕ CLOSE

        </button>

        <div id="songList"></div>

    </div>

</div>

</div>

<audio
    id="audio"
    preload="metadata">
</audio>

<script>

/* =====================================================
   BACKGROUNDS
===================================================== */

/*
   IMPORTANT:
   GitHub files ke exact naam:
   bg1. jpg
   bg2. jpg
   bg3. jpg
   bg4. jpg
   bg5. jpg
*/

const backgrounds = [

    "bg1.%20jpg",
    "bg2.%20jpg",
    "bg3.%20jpg",
    "bg4.%20jpg",
    "bg5.%20jpg"

];

let currentBackground = 0;

const backgroundImage =
    document.getElementById(
        "backgroundImage"
    );

/* PRELOAD */

backgrounds.forEach(function(file){

    const img = new Image();

    img.src = file;

});

/* CHANGE BACKGROUND */

function changeBackground(){

    currentBackground++;

    if(
        currentBackground >=
        backgrounds.length
    ){

        currentBackground = 0;

    }

    backgroundImage.style.opacity = "0";

    setTimeout(function(){

        backgroundImage.src =
            backgrounds[currentBackground];

        backgroundImage.style.opacity =
            "1";

    },300);

}

/* =====================================================
   SONGS
===================================================== */

const songs = [];

for(
    let i = 1;
    i <= 36;
    i++
){

    songs.push(
        "song%20(" + i + ").mp3"
    );

}

let currentSong = 0;

const audio =
    document.getElementById(
        "audio"
    );

const playBtn =
    document.getElementById(
        "playBtn"
    );

const songTitle =
    document.getElementById(
        "songTitle"
    );

const progress =
    document.getElementById(
        "progress"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );

const volumeRange =
    document.getElementById(
        "volumeRange"
    );

const muteBtn =
    document.getElementById(
        "muteBtn"
    );

/* LOAD SONG */

function loadSong(){

    audio.src =
        songs[currentSong];

    audio.load();

    songTitle.innerText =
        "Song " +
        (currentSong + 1);

    progressBar.style.width =
        "0%";

    updateSongList();

}

/* PLAY */

function togglePlay(){

    if(audio.paused){

        audio.play()
        .catch(function(){});

    }
    else{

        audio.pause();

    }

}

/* NEXT */

function nextSong(){

    currentSong++;

    if(
        currentSong >=
        songs.length
    ){

        currentSong = 0;

    }

    loadSong();

    audio.play()
    .catch(function(){});

}

/* PREVIOUS */

function previousSong(){

    currentSong--;

    if(currentSong < 0){

        currentSong =
            songs.length - 1;

    }

    loadSong();

    audio.play()
    .catch(function(){});

}

/* AUTO NEXT */

audio.addEventListener(
    "ended",
    nextSong
);

/* PLAY ICON */

audio.addEventListener(
    "play",
    function(){

        playBtn.innerText =
            "❚❚";

    }
);

audio.addEventListener(
    "pause",
    function(){

        playBtn.innerText =
            "▶";

    }
);

/* PROGRESS */

audio.addEventListener(
    "timeupdate",
    function(){

        if(
            audio.duration &&
            isFinite(audio.duration)
        ){

            progressBar.style.width =
                (
                    audio.currentTime /
                    audio.duration *
                    100
                ) +
                "%";

        }

    }
);

progress.addEventListener(
    "click",
    function(event){

        if(!audio.duration){

            return;

        }

        const rect =
            progress.getBoundingClientRect();

        const percent =
            (
                event.clientX -
                rect.left
            ) /
            rect.width;

        audio.currentTime =
            percent *
            audio.duration;

    }
);

/* =====================================================
   VOLUME
===================================================== */

function setVolume(value){

    audio.volume =
        Number(value);

    volumeRange.value =
        audio.volume;

    audio.muted = false;

    muteBtn.innerText =
        audio.volume === 0
        ? "🔇"
        : "🔊";

}

function volumeUp(){

    setVolume(
        Math.min(
            1,
            audio.volume + .1
        )
    );

}

function volumeDown(){

    setVolume(
        Math.max(
            0,
            audio.volume - .1
        )
    );

}

function toggleMute(){

    audio.muted =
        !audio.muted;

    muteBtn.innerText =
        audio.muted
        ? "🔇"
        : "🔊";

}

/* =====================================================
   SONG LIST
===================================================== */

function createSongList(){

    const list =
        document.getElementById(
            "songList"
        );

    list.innerHTML = "";

    songs.forEach(
        function(song,index){

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "songItem";

            item.innerHTML = `

                <span>
                    🎵 Song ${index + 1}
                </span>

                <button
                    class="songPlay"
                    onclick="selectSong(${index})">

                    ▶ Play

                </button>

            `;

            list.appendChild(item);

        }
    );

}

function updateSongList(){

    document
        .querySelectorAll(
            ".songItem"
        )
        .forEach(
            function(item,index){

                item.classList.toggle(
                    "active",
                    index === currentSong
                );

            }
        );

}

function selectSong(index){

    currentSong =
        index;

    loadSong();

    audio.play()
        .catch(function(){});

    closeSongs();

}

function openSongs(){

    document
        .getElementById(
            "songWindow"
        )
        .style.display =
        "block";

}

function closeSongs(){

    document
        .getElementById(
            "songWindow"
        )
        .style.display =
        "none";

}

/* =====================================================
   DATE / TIME
===================================================== */

function updateDateTime(){

    const now =
        new Date();

    document
        .getElementById(
            "liveTime"
        )
        .innerText =
        now.toLocaleTimeString(
            "hi-IN",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",
                hour12:true
            }
        );

    document
        .getElementById(
            "liveDate"
        )
        .innerText =
        now.toLocaleDateString(
            "hi-IN",
            {
                weekday:"long",
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        );

}

updateDateTime();

setInterval(
    updateDateTime,
    1000
);

/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.target.tagName ===
            "INPUT"
        ){

            return;

        }

        if(
            event.code ===
            "Space"
        ){

            event.preventDefault();

            togglePlay();

        }

        if(
            event.code ===
            "ArrowRight"
        ){

            nextSong();

        }

        if(
            event.code ===
            "ArrowLeft"
        ){

            previousSong();

        }

    }
);

/* =====================================================
   SPECIAL EFFECT
===================================================== */

let specialTimer = null;

function createParticles(){

    const effects =
        document.getElementById(
            "effects"
        );

    effects
        .querySelectorAll(
            ".particle"
        )
        .forEach(
            function(p){

                p.remove();

            }
        );

    for(
        let i = 0;
        i < 45;
        i++
    ){

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "particle";

        particle.style.left =
            Math.random() *
            100 +
            "%";

        particle.style.animationDuration =
            (
                3 +
                Math.random() * 6
            ) +
            "s";

        particle.style.animationDelay =
            (
                -Math.random() * 5
            ) +
            "s";

        particle.style.width =
            (
                2 +
                Math.random() * 5
            ) +
            "px";

        particle.style.height =
            particle.style.width;

        effects.appendChild(
            particle
        );

    }

}

function startSpecialEffect(){

    changeBackground();

    const effects =
        document.getElementById(
            "effects"
        );

    clearTimeout(
        specialTimer
    );

    createParticles();

    effects.classList.add(
        "active"
    );

    specialTimer =
        setTimeout(
            function(){

                effects.classList.remove(
                    "active"
                );

            },
            10000
        );

}

/* =====================================================
   START
===================================================== */

createSongList();

loadSong();

setVolume(1);

</script>

</body>
</html>
