<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTTAM PHOTOGRAPHY</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:white;
    overflow-x:hidden;
    background:#000;
}


/* BACKGROUND */

.background{
    position:fixed;
    inset:0;
    z-index:-10;

    background-image:
    linear-gradient(
        rgba(0,0,0,.25),
        rgba(0,0,0,.65)
    ),
    url("background1.jpg");

    background-size:cover;
    background-position:center;

    transition:
    background-image 1s ease-in-out;
}


/* TOP */

.top{
    position:fixed;
    top:0;
    left:0;
    right:0;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:22px 30px;

    z-index:20;
}

.time{
    font-size:22px;
    font-weight:bold;
    text-shadow:0 3px 15px #000;
}

.date{
    margin-top:4px;
    font-size:9px;
    letter-spacing:2px;
    opacity:.8;
}

.allSongs{
    border:1px solid rgba(255,255,255,.35);

    background:rgba(255,255,255,.10);

    color:white;

    padding:10px 18px;

    border-radius:30px;

    cursor:pointer;

    backdrop-filter:blur(15px);

    font-weight:bold;
}


/* MAIN */

.main{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:80px 20px 150px;
}

.content{
    width:100%;
    max-width:1000px;
}


/* SMALL TITLE */

.tag{
    display:inline-block;

    padding:9px 20px;

    border:1px solid rgba(255,255,255,.3);

    border-radius:30px;

    background:rgba(0,0,0,.25);

    backdrop-filter:blur(15px);

    font-size:10px;

    letter-spacing:4px;
}


/* MAIN NAME */

h1{
    margin-top:25px;

    font-family:Georgia,serif;

    font-size:
    clamp(48px,9vw,105px);

    line-height:.9;

    letter-spacing:-3px;

    text-shadow:
    0 8px 30px rgba(0,0,0,.9);
}

.gold{
    background:
    linear-gradient(
        90deg,
        #fff,
        #dcae45,
        #fff,
        #dcae45,
        #fff
    );

    background-size:300%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:shine 5s linear infinite;
}

@keyframes shine{

    0%{
        background-position:0%;
    }

    100%{
        background-position:300%;
    }

}

.subtitle{
    margin-top:20px;

    font-size:11px;

    letter-spacing:6px;

    opacity:.85;
}


/* GLASS PLAYER */

.player{

    position:fixed;

    bottom:18px;

    left:50%;

    transform:translateX(-50%);

    width:min(
        820px,
        calc(100% - 25px)
    );

    padding:15px 18px;

    border-radius:25px;

    background:
    rgba(255,255,255,.10);

    border:
    1px solid
    rgba(255,255,255,.30);

    backdrop-filter:
    blur(25px);

    -webkit-backdrop-filter:
    blur(25px);

    box-shadow:
    0 15px 50px
    rgba(0,0,0,.65);

    z-index:50;
}


.playerRow{

    display:flex;

    align-items:center;

    gap:12px;
}


/* PLAY */

.play{
    width:52px;
    height:52px;

    border-radius:50%;

    border:
    2px solid
    rgba(255,255,255,.8);

    background:
    rgba(0,0,0,.35);

    color:white;

    font-size:20px;

    cursor:pointer;

    flex-shrink:0;
}

.play:hover{
    transform:scale(1.08);
}


/* SONG NAME */

.info{
    flex:1;
    min-width:0;
}

.now{
    font-size:8px;
    letter-spacing:2px;
    opacity:.55;
}

.songName{
    margin-top:5px;

    font-size:15px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* PREVIOUS NEXT */

.control{
    background:transparent;

    border:0;

    color:white;

    font-size:35px;

    cursor:pointer;

    padding:5px 8px;
}

.control:hover{
    transform:scale(1.2);
}


/* PROGRESS */

.progress{

    width:100%;

    height:5px;

    margin-top:12px;

    appearance:none;

    border-radius:10px;

    background:
    rgba(255,255,255,.25);

    cursor:pointer;
}

.progress::-webkit-slider-thumb{

    appearance:none;

    width:13px;
    height:13px;

    border-radius:50%;

    background:white;

}


/* SONG LIST */

.songList{

    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    overflow:auto;

    padding:80px 20px 120px;

    background:
    rgba(0,0,0,.94);

    backdrop-filter:blur(20px);
}

.songList.show{
    display:block;
}

.songContainer{
    max-width:800px;
    margin:auto;
}

.close{
    float:right;

    border:1px solid
    rgba(255,255,255,.4);

    background:transparent;

    color:white;

    padding:8px 15px;

    border-radius:20px;

    cursor:pointer;
}

.songContainer h2{
    margin-bottom:25px;
}

.songItem{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:14px;

    margin:8px 0;

    border-radius:15px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid
    rgba(255,255,255,.10);
}

.songItem button{

    border:0;

    border-radius:20px;

    padding:8px 15px;

    cursor:pointer;
}

.songItem.active{
    background:
    rgba(255,255,255,.20);
}


/* MOBILE */

@media(max-width:600px){

    .top{
        padding:14px;
    }

    .time{
        font-size:17px;
    }

    .allSongs{
        padding:8px 12px;
        font-size:10px;
    }

    h1{
        font-size:52px;
    }

    .subtitle{
        font-size:8px;
        letter-spacing:3px;
    }

    .player{
        bottom:8px;
        padding:11px;
    }

    .play{
        width:45px;
        height:45px;
    }

}

</style>

</head>


<body>


<div
class="background"
id="background">
</div>


<!-- TOP -->

<div class="top">

    <div>

        <div
        class="time"
        id="time">
        00:00:00
        </div>

        <div
        class="date"
        id="date">
        </div>

    </div>


    <button
    class="allSongs"
    onclick="openSongs()">

    🎵 ALL SONGS

    </button>

</div>



<!-- MAIN -->

<div class="main">

    <div class="content">

        <div class="tag">

        📸 UTTAM PHOTOGRAPHY

        </div>


        <h1 class="gold">

        UTTAM<br>
        PHOTOGRAPHY

        </h1>


        <div class="subtitle">

        MUSIC • PHOTOGRAPHY • MEMORIES

        </div>

    </div>

</div>



<!-- PLAYER -->

<div class="player">

    <div class="playerRow">


        <button
        class="play"
        id="play"
        onclick="playPause()">

        ▶

        </button>


        <div class="info">

            <div class="now">

            NOW PLAYING

            </div>


            <div
            class="songName"
            id="songName">

            Song 1

            </div>

        </div>


        <button
        class="control"
        onclick="previousSong()">

        ‹

        </button>


        <button
        class="control"
        onclick="nextSong()">

        ›

        </button>

    </div>


    <input
    type="range"
    id="progress"
    class="progress"
    min="0"
    max="100"
    value="0">


    <audio
    id="audio">
    </audio>

</div>



<!-- SONG LIST -->

<div
class="songList"
id="songList">

    <div class="songContainer">

        <button
        class="close"
        onclick="closeSongs()">

        ✕ CLOSE

        </button>


        <h2>
        🎵 MY SONGS
        </h2>


        <div id="songItems"></div>

    </div>

</div>



<script>


/* SONG FILES */

const songs = [

    "song (1).mp3",
    "song (2).mp3",
    "song (3).mp3",
    "song (4).mp3",
    "song (5).mp3",
    "song (6).mp3",
    "song (7).mp3",
    "song (8).mp3",
    "song (9).mp3",
    "song (10).mp3",
    "song (11).mp3",
    "song (12).mp3",
    "song (13).mp3",
    "song (14).mp3",
    "song (15).mp3",
    "song (16).mp3",
    "song (17).mp3",
    "song (18).mp3"
];


/* 5 BACKGROUNDS */

const backgrounds = [

    "background1.jpg",
    "background2.jpg",
    "background3.jpg",
    "background4.jpg",
    "background5.jpg"

];


let current = 0;


const audio =
document.getElementById("audio");


const play =
document.getElementById("play");


const songName =
document.getElementById("songName");


const progress =
document.getElementById("progress");


const background =
document.getElementById("background");



/* LOAD SONG */

function loadSong(
    index,
    autoPlay=false
){

    current = index;


    if(current < 0){

        current =
        songs.length - 1;

    }


    if(current >= songs.length){

        current = 0;

    }


    audio.src =
    songs[current];


    songName.innerText =
    "🎵 Song " +
    (current + 1);


    /* CHANGE BACKGROUND */

    background.style.backgroundImage =

    `linear-gradient(
        rgba(0,0,0,.25),
        rgba(0,0,0,.65)
    ),
    url("${backgrounds[
        current % backgrounds.length
    ]}")`;


    progress.value = 0;


    updateSongList();


    if(autoPlay){

        audio.play()
        .catch(()=>{});

    }

}



/* PLAY PAUSE */

function playPause(){

    if(audio.paused){

        audio.play()
        .catch(()=>{});

    }
    else{

        audio.pause();

    }

}


/* PLAY */

audio.addEventListener(
"play",
function(){

    play.innerText="❚❚";

});


/* PAUSE */

audio.addEventListener(
"pause",
function(){

    play.innerText="▶";

});


/* AUTO NEXT */

audio.addEventListener(
"ended",
function(){

    nextSong();

});


/* NEXT */

function nextSong(){

    current++;

    if(current >= songs.length){

        current = 0;

    }

    loadSong(
        current,
        true
    );

}


/* PREVIOUS */

function previousSong(){

    current--;

    if(current < 0){

        current =
        songs.length - 1;

    }

    loadSong(
        current,
        true
    );

}


/* PROGRESS */

audio.addEventListener(
"timeupdate",
function(){

    if(audio.duration){

        progress.value =
        (
            audio.currentTime /
            audio.duration
        ) * 100;

    }

});


progress.addEventListener(
"input",
function(){

    if(audio.duration){

        audio.currentTime =
        (
            progress.value / 100
        ) *
        audio.duration;

    }

});



/* SONG LIST */

function createSongList(){

    const box =
    document.getElementById(
        "songItems"
    );


    box.innerHTML="";


    songs.forEach(
    function(file,index){

        const item =
        document.createElement(
            "div"
        );


        item.className =
        "songItem";


        item.innerHTML = `

        <span>
        🎵 Song ${index + 1}
        </span>

        <button
        onclick="selectSong(${index})">

        ▶ PLAY

        </button>

        `;


        box.appendChild(item);

    });

}


function selectSong(index){

    loadSong(
        index,
        true
    );

}


function updateSongList(){

    const items =
    document.querySelectorAll(
        ".songItem"
    );


    items.forEach(
    function(item,index){

        item.classList.toggle(
            "active",
            index === current
        );

    });

}


function openSongs(){

    document
    .getElementById(
        "songList"
    )
    .classList.add("show");

}


function closeSongs(){

    document
    .getElementById(
        "songList"
    )
    .classList.remove("show");

}



/* CLOCK */

function updateClock(){

    const now =
    new Date();


    document
    .getElementById("time")
    .innerText =
    now.toLocaleTimeString(
        "en-IN",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );


    document
    .getElementById("date")
    .innerText =
    now.toLocaleDateString(
        "en-IN",
        {
            weekday:"long",
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    ).toUpperCase();

}


createSongList();

loadSong(0);

updateClock();

setInterval(
    updateClock,
    1000
);


</script>

</body>
</html>
