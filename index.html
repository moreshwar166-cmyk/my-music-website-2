<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTTAM PHOTOGRAPHY - MY MUSIC</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial, sans-serif;
    color:white;
}

body{

    background:
    linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.75)),
    url("background.jpg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

}

/* HEADER */

.header{
    text-align:center;
    padding:25px 10px 10px;
}

.header h1{
    margin:0;
    font-size:32px;
    letter-spacing:2px;
    text-shadow:0 0 15px rgba(255,255,255,0.5);
}

.brand{
    margin-top:7px;
    font-size:14px;
    letter-spacing:4px;
    opacity:0.8;
}

/* DATE TIME */

.date-time{
    text-align:center;
    margin:10px auto 20px;
    font-size:15px;
}

#liveDate{
    margin-bottom:5px;
}

#liveTime{
    font-size:22px;
    font-weight:bold;
}

/* NOW PLAYING */

.now-playing{

    width:90%;
    max-width:950px;

    margin:auto;

    background:rgba(20,20,20,0.72);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:18px;

    padding:20px;

    box-shadow:0 10px 40px rgba(0,0,0,0.45);

    backdrop-filter:blur(8px);

}

/* SONG TITLE */

#song-title{

    text-align:center;

    font-size:21px;

    font-weight:bold;

    margin-bottom:15px;

}

/* AUDIO */

audio{

    width:100%;

    height:45px;

}

/* CONTROLS */

.controls{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    margin-top:15px;

    flex-wrap:wrap;

}

.controls button{

    border:none;

    border-radius:30px;

    padding:12px 22px;

    background:rgba(255,255,255,0.12);

    color:white;

    border:1px solid rgba(255,255,255,0.25);

    cursor:pointer;

    font-size:15px;

    transition:0.2s;

}

.controls button:hover{

    background:rgba(255,255,255,0.25);

    transform:scale(1.04);

}

/* SPECIAL BUTTON */

.special-btn{

    background:linear-gradient(135deg,#7c3aed,#ec4899) !important;

    border:none !important;

    font-weight:bold;

}

/* VOLUME */

.volume-box{

    display:flex;

    justify-content:flex-end;

    align-items:center;

    gap:8px;

    margin-top:15px;

}

.volume-box span{

    font-size:18px;

}

#volume{

    width:140px;

    cursor:pointer;

}

/* PLAYLIST */

#playlist{

    width:90%;

    max-width:950px;

    margin:20px auto 40px;

}

/* SONG ITEM */

.song-item{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:13px 15px;

    margin:8px 0;

    border-radius:13px;

    background:rgba(25,25,25,0.72);

    border:1px solid rgba(255,255,255,0.08);

    transition:0.2s;

}

.song-item:hover{

    background:rgba(255,255,255,0.13);

    transform:translateX(3px);

}

.song-item.active{

    background:rgba(124,58,237,0.35);

    border:1px solid rgba(255,255,255,0.25);

}

.song-name{

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}

.song-play{

    min-width:45px;

    height:40px;

    border-radius:50%;

    border:none;

    cursor:pointer;

    font-size:17px;

}

/* SPECIAL POPUP */

#specialBox{

    position:fixed;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%) scale(0.8);

    width:min(90%,500px);

    padding:35px 25px;

    text-align:center;

    border-radius:25px;

    background:

    linear-gradient(

        135deg,

        rgba(124,58,237,0.95),

        rgba(236,72,153,0.95)

    );

    box-shadow:

    0 20px 80px rgba(0,0,0,0.7);

    opacity:0;

    visibility:hidden;

    transition:0.4s;

    z-index:9999;

}

#specialBox.show{

    opacity:1;

    visibility:visible;

    transform:translate(-50%,-50%) scale(1);

}

#specialBox h2{

    margin:0 0 10px;

    font-size:30px;

}

#specialBox p{

    margin:5px 0;

    font-size:17px;

}

/* 10 SECOND PROGRESS */

.special-progress{

    width:100%;

    height:5px;

    background:rgba(255,255,255,0.25);

    border-radius:10px;

    margin-top:20px;

    overflow:hidden;

}

#specialProgressBar{

    width:100%;

    height:100%;

    background:white;

    transform-origin:left;

}

/* FOOTER */

.footer{

    text-align:center;

    padding:20px;

    opacity:0.7;

    font-size:13px;

}

/* MOBILE */

@media(max-width:600px){

    .header h1{

        font-size:24px;

    }

    .now-playing{

        width:94%;

        padding:15px;

    }

    #playlist{

        width:94%;

    }

    .song-item{

        padding:11px;

    }

    .controls button{

        padding:10px 15px;

    }

    .volume-box{

        justify-content:center;

    }

}

</style>
</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>🎵 MY MUSIC 🎵</h1>

    <div class="brand">
        UTTAM PHOTOGRAPHY
    </div>

</div>


<!-- DATE TIME -->

<div class="date-time">

    <div id="liveDate"></div>

    <div id="liveTime"></div>

</div>


<!-- MUSIC PLAYER -->

<div class="now-playing">

    <div id="song-title">
        🎵 Song 1
    </div>


    <audio id="audio" controls></audio>


    <div class="controls">

        <button onclick="previousSong()">
            ⏮️ Previous
        </button>

        <button onclick="togglePlay()" id="playBtn">
            ▶️ Play
        </button>

        <button onclick="nextSong()">
            ⏭️ Next
        </button>

        <button
            class="special-btn"
            onclick="showSpecial()">

            ✨ SPECIAL

        </button>

    </div>


    <!-- VOLUME RIGHT SIDE -->

    <div class="volume-box">

        <span>🔊</span>

        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="0.7">

    </div>

</div>


<!-- PLAYLIST -->

<div id="playlist"></div>


<!-- SPECIAL POPUP -->

<div id="specialBox">

    <h2>✨ UTTAM PHOTOGRAPHY ✨</h2>

    <p>🎵 Enjoy Your Music 🎵</p>

    <p>
        Thanks for listening!
    </p>

    <div class="special-progress">

        <div id="specialProgressBar"></div>

    </div>

</div>


<div class="footer">

    © UTTAM PHOTOGRAPHY

</div>



<script>


/* =========================================
   36 SONGS
========================================= */

const songs = [];


for(let i = 1; i <= 36; i++){

    songs.push({

        title: "Song " + i,

        src: "song (" + i + ").mp3"

    });

}



/* =========================================
   PLAYER
========================================= */

let currentSong = 0;

const audio =
document.getElementById("audio");

const title =
document.getElementById("song-title");

const playBtn =
document.getElementById("playBtn");



/* =========================================
   PLAY SONG
========================================= */

function playSong(index){

    if(index < 0){

        index = songs.length - 1;

    }

    if(index >= songs.length){

        index = 0;

    }


    currentSong = index;


    audio.src =
    songs[index].src;


    title.textContent =
    "🎵 " + songs[index].title;


    audio.play()
    .then(()=>{

        playBtn.textContent =
        "⏸️ Pause";

    })
    .catch(()=>{

        playBtn.textContent =
        "▶️ Play";

    });


    updatePlaylist();

}



/* =========================================
   PLAY / PAUSE
========================================= */

function togglePlay(){

    if(!audio.src){

        playSong(currentSong);

        return;

    }


    if(audio.paused){

        audio.play();

        playBtn.textContent =
        "⏸️ Pause";

    }

    else{

        audio.pause();

        playBtn.textContent =
        "▶️ Play";

    }

}



/* =========================================
   NEXT
========================================= */

function nextSong(){

    currentSong++;

    if(currentSong >= songs.length){

        currentSong = 0;

    }

    playSong(currentSong);

}



/* =========================================
   PREVIOUS
========================================= */

function previousSong(){

    currentSong--;

    if(currentSong < 0){

        currentSong =
        songs.length - 1;

    }

    playSong(currentSong);

}



/* =========================================
   AUTO NEXT
========================================= */

audio.addEventListener(
    "ended",
    function(){

        nextSong();

    }
);



/* =========================================
   VOLUME
========================================= */

const volume =
document.getElementById("volume");


audio.volume =
parseFloat(volume.value);


volume.addEventListener(
    "input",
    function(){

        audio.volume =
        parseFloat(this.value);

    }
);



/* =========================================
   PLAYLIST
========================================= */

function updatePlaylist(){

    const playlist =
    document.getElementById("playlist");


    playlist.innerHTML = "";


    songs.forEach(
        (song,index)=>{

            const item =
            document.createElement("div");


            item.className =
            "song-item";


            if(index === currentSong){

                item.classList.add("active");

            }


            item.innerHTML = `

                <div class="song-name">

                    🎵 ${song.title}

                </div>

                <button
                    class="song-play"
                    onclick="playSong(${index})">

                    ▶️

                </button>

            `;


            playlist.appendChild(item);

        }
    );

}



/* =========================================
   DATE & TIME
========================================= */

function updateDateTime(){

    const now =
    new Date();


    const date =
    now.toLocaleDateString(
        "hi-IN",
        {
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );


    const time =
    now.toLocaleTimeString(
        "hi-IN",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );


    document.getElementById(
        "liveDate"
    ).textContent =
    "📅 " + date;


    document.getElementById(
        "liveTime"
    ).textContent =
    "⏰ " + time;

}


updateDateTime();

setInterval(
    updateDateTime,
    1000
);



/* =========================================
   SPACE KEY PLAY / PAUSE
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.code === "Space"){

            const tag =
            document.activeElement.tagName;


            if(
                tag !== "INPUT" &&
                tag !== "BUTTON"
            ){

                event.preventDefault();

                togglePlay();

            }

        }

    }
);



/* =========================================
   SPECIAL BUTTON
   SHOW FOR 10 SECONDS
========================================= */

let specialTimer;


function showSpecial(){

    const box =
    document.getElementById(
        "specialBox"
    );


    const bar =
    document.getElementById(
        "specialProgressBar"
    );


    clearTimeout(
        specialTimer
    );


    box.classList.add("show");


    /* progress reset */

    bar.style.transition = "none";

    bar.style.transform =
    "scaleX(1)";


    /* browser repaint */

    void bar.offsetWidth;


    /* 10 second animation */

    bar.style.transition =
    "transform 10s linear";

    bar.style.transform =
    "scaleX(0)";


    /* 10 seconds बाद hide */

    specialTimer =
    setTimeout(
        function(){

            box.classList.remove(
                "show"
            );

        },
        10000
    );

}



/* =========================================
   START
========================================= */

updatePlaylist();


</script>


</body>
</html>
