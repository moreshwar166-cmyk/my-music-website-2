<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>UTTAM PHOTOGRAPHY</title>


<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;

    color:white;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    overflow-x:hidden;

    background:#080808;

}


/* =========================
   BACKGROUND
========================= */

.background{

    position:fixed;

    inset:0;

    z-index:-5;

    background-image:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.72)
    ),
    url("background1.png");

    background-size:cover;

    background-position:center;

    transition:
    background-image 1.2s ease-in-out,
    opacity .6s ease;

}


/* DARK OVERLAY */

.background::after{

    content:"";

    position:absolute;

    inset:0;

    background:
    radial-gradient(
        circle at center,
        transparent 20%,
        rgba(0,0,0,.65) 100%
    );

}


/* =========================
   TOP BAR
========================= */

.topbar{

    position:fixed;

    top:0;

    left:0;

    right:0;

    z-index:20;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px 28px;

}


.clock{

    font-size:22px;

    font-weight:bold;

    text-shadow:
    0 3px 15px black;

}


.date{

    margin-top:5px;

    font-size:10px;

    letter-spacing:2px;

    opacity:.75;

}


.allSongs{

    padding:10px 18px;

    border-radius:30px;

    border:
    1px solid
    rgba(255,255,255,.3);

    background:
    rgba(255,255,255,.10);

    color:white;

    cursor:pointer;

    backdrop-filter:
    blur(15px);

    font-weight:bold;

    transition:.3s;

}


.allSongs:hover{

    background:
    rgba(255,255,255,.22);

    transform:scale(1.05);

}


/* =========================
   MAIN
========================= */

.main{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:
    90px 20px 180px;

}


.content{

    width:100%;

    max-width:900px;

}


/* =========================
   LOGO
========================= */

.logo{

    width:
    clamp(150px,20vw,220px);

    height:
    clamp(150px,20vw,220px);

    object-fit:contain;

    border-radius:50%;

    filter:
    drop-shadow(
        0 0 25px
        rgba(255,190,60,.45)
    );

    animation:
    logoFloat 4s ease-in-out infinite;

}


@keyframes logoFloat{

    0%,100%{

        transform:
        translateY(0)
        scale(1);

    }

    50%{

        transform:
        translateY(-8px)
        scale(1.03);

    }

}


/* =========================
   TITLE
========================= */

.tag{

    display:inline-block;

    margin-top:22px;

    padding:
    8px 18px;

    border-radius:30px;

    background:
    rgba(0,0,0,.35);

    border:
    1px solid
    rgba(255,255,255,.25);

    backdrop-filter:
    blur(12px);

    font-size:10px;

    letter-spacing:3px;

}


h1{

    margin-top:20px;

    font-family:
    Georgia,
    serif;

    font-size:
    clamp(
        48px,
        9vw,
        100px
    );

    line-height:.9;

    letter-spacing:-3px;

    text-shadow:
    0 8px 30px black;

}


.gold{

    background:

    linear-gradient(
        90deg,
        #ffffff,
        #f5c75b,
        #ffffff,
        #d89f25,
        #ffffff
    );

    background-size:300%;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:
    shine 5s linear infinite;

}


@keyframes shine{

    0%{
        background-position:0%;
    }

    100%{
        background-position:300%;
    }

}


.subtitle{

    margin-top:18px;

    font-size:11px;

    letter-spacing:5px;

    opacity:.8;

}


/* =========================
   GLASS PLAYER
========================= */

.player{

    position:fixed;

    left:50%;

    bottom:18px;

    transform:
    translateX(-50%);

    z-index:50;

    width:
    min(
        820px,
        calc(100% - 24px)
    );

    padding:
    15px 18px;

    border-radius:25px;

    background:
    rgba(
        255,
        255,
        255,
        .09
    );

    border:
    1px solid
    rgba(
        255,
        255,
        255,
        .25
    );

    backdrop-filter:
    blur(25px);

    -webkit-backdrop-filter:
    blur(25px);

    box-shadow:

    0 15px 50px
    rgba(0,0,0,.65),

    inset 0 1px 1px
    rgba(255,255,255,.15);

    transition:
    .4s;

}


.player.playing{

    box-shadow:

    0 15px 60px
    rgba(0,0,0,.7),

    0 0 40px
    rgba(255,190,70,.20),

    inset 0 1px 1px
    rgba(255,255,255,.2);

}


/* PLAYER ROW */

.playerRow{

    display:flex;

    align-items:center;

    gap:12px;

}


/* PLAY BUTTON */

.playButton{

    width:52px;

    height:52px;

    flex-shrink:0;

    border-radius:50%;

    border:
    2px solid
    rgba(255,255,255,.8);

    background:
    rgba(0,0,0,.45);

    color:white;

    cursor:pointer;

    font-size:20px;

    display:flex;

    justify-content:center;

    align-items:center;

    transition:.3s;

}


.playButton:hover{

    transform:
    scale(1.1);

    background:
    rgba(255,255,255,.18);

}


.player.playing
.playButton{

    animation:
    pulse 1.3s infinite;

}


@keyframes pulse{

    0%,100%{

        box-shadow:
        0 0 0 0
        rgba(255,210,100,.4);

    }

    50%{

        box-shadow:
        0 0 0 13px
        rgba(255,210,100,0);

    }

}


/* SONG INFO */

.songInfo{

    flex:1;

    min-width:0;

}


.now{

    font-size:8px;

    letter-spacing:2px;

    opacity:.55;

}


.songTitle{

    margin-top:4px;

    font-size:15px;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.player.playing
.songTitle{

    animation:
    titlePulse 1.5s infinite alternate;

}


@keyframes titlePulse{

    from{

        opacity:.65;

    }

    to{

        opacity:1;

    }

}


/* NEXT PREVIOUS */

.control{

    background:
    transparent;

    border:0;

    color:white;

    font-size:32px;

    cursor:pointer;

    padding:
    5px 8px;

    transition:.2s;

}


.control:hover{

    transform:
    scale(1.25);

}


/* PROGRESS */

.progress{

    width:100%;

    height:5px;

    margin-top:11px;

    appearance:none;

    border-radius:10px;

    background:
    rgba(255,255,255,.18);

    cursor:pointer;

}


.progress::-webkit-slider-thumb{

    appearance:none;

    width:13px;

    height:13px;

    border-radius:50%;

    background:white;

    box-shadow:
    0 0 10px
    rgba(255,255,255,.8);

}


/* =========================
   SONG LIST
========================= */

.songList{

    display:none;

    position:fixed;

    inset:0;

    z-index:100;

    overflow:auto;

    padding:
    80px 20px 130px;

    background:
    rgba(5,5,5,.95);

    backdrop-filter:
    blur(20px);

}


.songList.show{

    display:block;

}


.songBox{

    max-width:850px;

    margin:auto;

}


.songBox h2{

    margin-bottom:20px;

    font-size:30px;

}


.close{

    float:right;

    padding:
    8px 15px;

    border-radius:20px;

    border:
    1px solid
    rgba(255,255,255,.4);

    background:
    transparent;

    color:white;

    cursor:pointer;

}


.song{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;

    padding:14px;

    margin:8px 0;

    border-radius:14px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid
    rgba(255,255,255,.08);

}


.song.active{

    background:
    rgba(255,255,255,.18);

    box-shadow:
    inset 3px 0
    #e7b94e;

}


.song button{

    border:0;

    border-radius:20px;

    padding:
    8px 15px;

    cursor:pointer;

    font-weight:bold;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .topbar{

        padding:
        13px;

    }


    .clock{

        font-size:17px;

    }


    .date{

        font-size:7px;

        letter-spacing:1px;

    }


    .allSongs{

        padding:
        8px 12px;

        font-size:10px;

    }


    .logo{

        width:150px;

        height:150px;

    }


    h1{

        font-size:52px;

    }


    .subtitle{

        font-size:8px;

        letter-spacing:3px;

    }


    .player{

        bottom:8px;

        padding:
        11px;

        border-radius:20px;

    }


    .playButton{

        width:44px;

        height:44px;

    }


    .songTitle{

        font-size:13px;

    }

}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div
class="background"
id="background">
</div>



<!-- TOP -->

<div class="topbar">


    <div>

        <div
        class="clock"
        id="clock">

        00:00:00

        </div>


        <div
        class="date"
        id="date">

        </div>

    </div>


    <button
    class="allSongs"
    onclick="openSongs()">

        🎵 ALL SONGS

    </button>


</div>



<!-- MAIN -->

<main class="main">


    <div class="content">


        <!-- YOUR LOGO -->

        <img
        src="logo.png"
        class="logo"
        alt="UTTAM PHOTOGRAPHY">


        <div class="tag">

            📸 UTTAM PHOTOGRAPHY

        </div>


        <h1 class="gold">

            UTTAM<br>

            PHOTOGRAPHY

        </h1>


        <div class="subtitle">

            MUSIC • PHOTOGRAPHY • MEMORIES

        </div>


    </div>

</main>



<!-- GLASS PLAYER -->

<div
class="player"
id="player">


    <div class="playerRow">


        <button
        class="playButton"
        id="playButton"
        onclick="playPause()">

            ▶

        </button>


        <div class="songInfo">


            <div class="now">

                NOW PLAYING

            </div>


            <div
            class="songTitle"
            id="songTitle">

                Song 1

            </div>


        </div>


        <button
        class="control"
        onclick="previousSong()">

            ‹

        </button>


        <button
        class="control"
        onclick="nextSong()">

            ›

        </button>


    </div>


    <input
    type="range"
    id="progress"
    class="progress"
    min="0"
    max="100"
    value="0">


    <audio
    id="audio"
    preload="metadata">
    </audio>


</div>



<!-- SONG LIST -->

<div
class="songList"
id="songList">


    <div class="songBox">


        <button
        class="close"
        onclick="closeSongs()">

            ✕ CLOSE

        </button>


        <h2>

            🎵 MY SONGS

        </h2>


        <div id="songs">

        </div>


    </div>

</div>



<script>


/* =========================
   SONGS
========================= */


const songs=[];


for(
    let i=1;
    i<=35;
    i++
){

    songs.push({

        name:
        "Song " + i,

        file:
        "song (" + i + ").mp3"

    });

}



/* =========================
   BACKGROUNDS
========================= */


const backgrounds=[

    "background1.png",

    "background2.png",

    "background3.png",

    "background4.png",

    "background5.png"

];


let currentSong=0;



/* =========================
   ELEMENTS
========================= */


const audio=
document.getElementById(
    "audio"
);


const player=
document.getElementById(
    "player"
);


const playButton=
document.getElementById(
    "playButton"
);


const songTitle=
document.getElementById(
    "songTitle"
);


const progress=
document.getElementById(
    "progress"
);


const background=
document.getElementById(
    "background"
);



/* =========================
   CHANGE BACKGROUND
========================= */


function changeBackground(){

    const bgIndex=
    currentSong %
    backgrounds.length;


    background.style.opacity="0";


    setTimeout(
        function(){

            background.style.backgroundImage=

            `
            linear-gradient(
                rgba(0,0,0,.35),
                rgba(0,0,0,.72)
            ),
            url("${backgrounds[bgIndex]}")
            `;


            background.style.opacity="1";

        },
        350
    );

}



/* =========================
   LOAD SONG
========================= */


function loadSong(
    index,
    autoPlay=false
){

    currentSong=index;


    if(
        currentSong<0
    ){

        currentSong=
        songs.length-1;

    }


    if(
        currentSong>=songs.length
    ){

        currentSong=0;

    }


    audio.src=
    songs[currentSong].file;


    songTitle.innerText=
    "🎵 "+
    songs[currentSong].name;


    progress.value=0;


    changeBackground();


    updateSongList();


    if(autoPlay){

        audio.play()
        .catch(
            ()=>{}
        );

    }

}



/* =========================
   PLAY PAUSE
========================= */


function playPause(){

    if(
        audio.paused
    ){

        audio.play()
        .catch(
            ()=>{}
        );

    }

    else{

        audio.pause();

    }

}



/* =========================
   PLAY
========================= */


audio.addEventListener(
    "play",
    function(){

        playButton.innerText="❚❚";

        player.classList.add(
            "playing"
        );

    }
);



/* =========================
   PAUSE
========================= */


audio.addEventListener(
    "pause",
    function(){

        playButton.innerText="▶";

        player.classList.remove(
            "playing"
        );

    }
);



/* =========================
   AUTO NEXT
========================= */


audio.addEventListener(
    "ended",
    function(){

        nextSong();

    }
);



/* =========================
   NEXT
========================= */


function nextSong(){

    currentSong++;


    if(
        currentSong>=songs.length
    ){

        currentSong=0;

    }


    loadSong(
        currentSong,
        true
    );

}



/* =========================
   PREVIOUS
========================= */


function previousSong(){

    currentSong--;


    if(
        currentSong<0
    ){

        currentSong=
        songs.length-1;

    }


    loadSong(
        currentSong,
        true
    );

}



/* =========================
   PROGRESS
========================= */


audio.addEventListener(
    "timeupdate",
    function(){

        if(
            audio.duration
        ){

            progress.value=
            (
                audio.currentTime/
                audio.duration
            )*100;

        }

    }
);



progress.addEventListener(
    "input",
    function(){

        if(
            audio.duration
        ){

            audio.currentTime=
            (
                progress.value/
                100
            )*
            audio.duration;

        }

    }
);



/* =========================
   SONG LIST
========================= */


function createSongList(){

    const box=
    document.getElementById(
        "songs"
    );


    box.innerHTML="";


    songs.forEach(
        function(song,index){

            const item=
            document.createElement(
                "div"
            );


            item.className="song";


            item.innerHTML=`

                <span>

                    🎵 ${song.name}

                </span>


                <button
                onclick="
                playSelectedSong(
                    ${index}
                )">

                    ▶ PLAY

                </button>

            `;


            box.appendChild(
                item
            );

        }
    );

}



/* =========================
   SELECT SONG
========================= */


function playSelectedSong(
    index
){

    loadSong(
        index,
        true
    );

}



/* =========================
   UPDATE LIST
========================= */


function updateSongList(){

    const items=
    document.querySelectorAll(
        ".song"
    );


    items.forEach(
        function(item,index){

            if(
                index===currentSong
            ){

                item.classList.add(
                    "active"
                );

            }

            else{

                item.classList.remove(
                    "active"
                );

            }

        }
    );

}



/* =========================
   OPEN LIST
========================= */


function openSongs(){

    document
    .getElementById(
        "songList"
    )
    .classList.add(
        "show"
    );


    updateSongList();

}



/* =========================
   CLOSE LIST
========================= */


function closeSongs(){

    document
    .getElementById(
        "songList"
    )
    .classList.remove(
        "show"
    );

}



/* =========================
   CLOCK
========================= */


function updateClock(){

    const now=
    new Date();


    document
    .getElementById(
        "clock"
    )
    .innerText=
    now.toLocaleTimeString(
        "en-IN",
        {

            hour:"2-digit",

            minute:"2-digit",

            second:"2-digit",

            hour12:true

        }
    );


    document
    .getElementById(
        "date"
    )
    .innerText=
    now.toLocaleDateString(
        "en-IN",
        {

            weekday:"long",

            day:"2-digit",

            month:"long",

            year:"numeric"

        }
    ).toUpperCase();

}



/* =========================
   START
========================= */


createSongList();


loadSong(
    0,
    false
);


updateClock();


setInterval(
    updateClock,
    1000
);


</script>


</body>

</html>
