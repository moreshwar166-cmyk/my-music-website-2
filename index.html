<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UTTAM PHOTOGRAPHY</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial, sans-serif;
    color:white;
    background:#000;
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    transition:background-image 0.8s ease;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.48);
    z-index:-1;
}

.top{
    position:relative;
    padding:25px 30px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.time{
    font-size:24px;
    font-weight:bold;
}

.date{
    font-size:11px;
    letter-spacing:2px;
    margin-top:5px;
    opacity:.8;
}

.allSongs{
    border:1px solid rgba(255,255,255,.4);
    background:rgba(20,20,20,.55);
    color:white;
    padding:12px 20px;
    border-radius:30px;
    cursor:pointer;
    backdrop-filter:blur(15px);
}

.hero{
    min-height:calc(100vh - 100px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px 20px 120px;
}

.smallTitle{
    border:1px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.25);
    padding:10px 28px;
    border-radius:30px;
    font-size:12px;
    letter-spacing:4px;
    margin-bottom:35px;
    backdrop-filter:blur(12px);
}

h1{
    font-family:Georgia,serif;
    font-size:clamp(55px,9vw,125px);
    line-height:.85;
    letter-spacing:-4px;
    background:linear-gradient(
        180deg,
        #fff3bd,
        #c9972e,
        #fff1b0,
        #8c6419
    );
    -webkit-background-clip:text;
    color:transparent;
    text-shadow:0 5px 25px rgba(0,0,0,.7);
}

.sub{
    margin-top:30px;
    letter-spacing:7px;
    font-size:12px;
    opacity:.8;
}

.player{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    width:min(820px,90%);
    padding:16px 20px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:25px;
    background:rgba(20,20,20,.38);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.playerTop{
    display:flex;
    align-items:center;
    gap:15px;
}

.play{
    width:52px;
    height:52px;
    border-radius:50%;
    border:2px solid white;
    background:rgba(255,255,255,.08);
    color:white;
    font-size:21px;
    cursor:pointer;
}

.info{
    flex:1;
    text-align:left;
}

.now{
    font-size:9px;
    letter-spacing:3px;
    opacity:.55;
    margin-bottom:5px;
}

.songName{
    font-size:17px;
    font-weight:bold;
}

.buttons{
    display:flex;
    gap:20px;
}

.nextBtn{
    background:none;
    border:0;
    color:white;
    font-size:28px;
    cursor:pointer;
}

.progress{
    width:100%;
    margin-top:12px;
    height:6px;
    border-radius:10px;
    background:rgba(255,255,255,.25);
    cursor:pointer;
}

.progressBar{
    height:100%;
    width:0%;
    border-radius:10px;
    background:white;
}

.songs{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(15px);
    padding:50px 20px;
    overflow:auto;
}

.songList{
    max-width:700px;
    margin:auto;
}

.close{
    display:block;
    margin:0 auto 25px;
    background:white;
    border:0;
    padding:10px 25px;
    border-radius:20px;
    cursor:pointer;
}

.songItem{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    margin:8px 0;
    border-radius:15px;
    background:rgba(255,255,255,.1);
}

.songItem button{
    border:0;
    border-radius:20px;
    padding:8px 18px;
    cursor:pointer;
}

@media(max-width:600px){
    h1{
        letter-spacing:-2px;
    }

    .top{
        padding:18px;
    }

    .time{
        font-size:18px;
    }

    .player{
        bottom:10px;
    }
}
</style>
</head>

<body>

<div class="top">
    <div>
        <div class="time" id="clock">00:00:00</div>
        <div class="date" id="date"></div>
    </div>

    <button class="allSongs" onclick="openSongs()">🎵 ALL SONGS</button>
</div>

<section class="hero">

    <div class="smallTitle">
        📸 &nbsp; U T T A M &nbsp; P H O T O G R A P H Y
    </div>

    <h1>
        UTTAM<br>
        PHOTOGRAPHY
    </h1>

    <div class="sub">
        MUSIC • PHOTOGRAPHY • MEMORIES
    </div>

</section>

<!-- MUSIC PLAYER -->

<div class="player">

    <div class="playerTop">

        <button class="play" id="playBtn" onclick="togglePlay()">▶</button>

        <div class="info">
            <div class="now">NOW PLAYING</div>
            <div class="songName" id="songName">Song 1</div>
        </div>

        <div class="buttons">
            <button class="nextBtn" onclick="previousSong()">‹</button>
            <button class="nextBtn" onclick="nextSong()">›</button>
        </div>

    </div>

    <div class="progress" onclick="seek(event)">
        <div class="progressBar" id="progressBar"></div>
    </div>

</div>

<!-- SONG LIST -->

<div class="songs" id="songsBox">

    <div class="songList">

        <button class="close" onclick="closeSongs()">✕ CLOSE</button>

        <div id="songList"></div>

    </div>

</div>

<audio id="audio"></audio>

<script>

/* =========================
   SONGS
========================= */

const songs = [
    "song (1).mp3",
    "song (2).mp3",
    "song (3).mp3",
    "song (4).mp3",
    "song (5).mp3",
    "song (6).mp3",
    "song (7).mp3",
    "song (8).mp3",
    "song (9).mp3",
    "song (10).mp3",
    "song (11).mp3",
    "song (12).mp3",
    "song (13).mp3",
    "song (14).mp3",
    "song (15).mp3",
    "song (16).mp3",
    "song (17).mp3",
    "song (18).mp3"
];


/* =========================
   5 BACKGROUNDS
========================= */

const backgrounds = [
    "background (1).jpg",
    "background (2).jpg",
    "background (3).jpg",
    "background (4).jpg",
    "background (5).jpg"
];

let currentSong = 0;

const audio = document.getElementById("audio");
const songName = document.getElementById("songName");
const playBtn = document.getElementById("playBtn");
const progressBar = document.getElementById("progressBar");


/* =========================
   BACKGROUND CHANGE
========================= */

function changeBackground(){

    const bg = backgrounds[currentSong % backgrounds.length];

    document.body.style.backgroundImage =
        "url('" + bg + "')";
}


/* =========================
   LOAD SONG
========================= */

function loadSong(){

    audio.src = songs[currentSong];

    songName.innerText =
        "Song " + (currentSong + 1);

    changeBackground();

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay(){

    if(audio.paused){

        audio.play();

        playBtn.innerText = "❚❚";

    }else{

        audio.pause();

        playBtn.innerText = "▶";

    }

}


/* =========================
   NEXT SONG
========================= */

function nextSong(){

    currentSong++;

    if(currentSong >= songs.length){
        currentSong = 0;
    }

    loadSong();

    audio.play();

    playBtn.innerText = "❚❚";

}


/* =========================
   PREVIOUS SONG
========================= */

function previousSong(){

    currentSong--;

    if(currentSong < 0){
        currentSong = songs.length - 1;
    }

    loadSong();

    audio.play();

    playBtn.innerText = "❚❚";

}


/* =========================
   AUTOMATIC NEXT SONG
========================= */

audio.addEventListener("ended", function(){

    nextSong();

});


/* =========================
   PROGRESS BAR
========================= */

audio.addEventListener("timeupdate", function(){

    if(audio.duration){

        const percent =
            (audio.currentTime / audio.duration) * 100;

        progressBar.style.width =
            percent + "%";

    }

});


function seek(event){

    const rect =
        event.currentTarget.getBoundingClientRect();

    const percent =
        (event.clientX - rect.left) / rect.width;

    audio.currentTime =
        percent * audio.duration;

}


/* =========================
   SONG LIST
========================= */

function createSongList(){

    const list =
        document.getElementById("songList");

    list.innerHTML = "";

    songs.forEach((song,index)=>{

        const item =
            document.createElement("div");

        item.className = "songItem";

        item.innerHTML = `
            <span>🎵 Song ${index + 1}</span>
            <button onclick="selectSong(${index})">
                ▶ Play
            </button>
        `;

        list.appendChild(item);

    });

}


function selectSong(index){

    currentSong = index;

    loadSong();

    audio.play();

    playBtn.innerText = "❚❚";

    closeSongs();

}


function openSongs(){

    document.getElementById("songsBox")
    .style.display = "block";

}


function closeSongs(){

    document.getElementById("songsBox")
    .style.display = "none";

}


/* =========================
   CLOCK
========================= */

function updateClock(){

    const now = new Date();

    let h = now.getHours();

    const m =
        String(now.getMinutes()).padStart(2,"0");

    const s =
        String(now.getSeconds()).padStart(2,"0");

    const ampm =
        h >= 12 ? "pm" : "am";

    h = h % 12 || 12;

    document.getElementById("clock").innerText =
        String(h).padStart(2,"0") +
        ":" + m +
        ":" + s +
        " " + ampm;

    document.getElementById("date").innerText =
        now.toLocaleDateString(
            "en-IN",
            {
                weekday:"long",
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        ).toUpperCase();

}

setInterval(updateClock,1000);

updateClock();


/* =========================
   START
========================= */

createSongList();

loadSong();

</script>

</body>
</html>
