<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Music</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.80)),
                url("background.jpg") center/cover fixed;
        }

        .header {
            text-align: center;
            padding: 25px 15px 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
            text-shadow: 0 3px 10px black;
        }

        .date-time {
            text-align: center;
            margin: 10px auto 20px;
        }

        #liveDate {
            font-size: 18px;
            margin-bottom: 5px;
        }

        #liveTime {
            font-size: 28px;
            font-weight: bold;
        }

        .now-playing {
            width: 90%;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 18px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        #song-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        audio {
            width: 100%;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            background: white;
            color: black;
        }

        button:hover {
            transform: scale(1.05);
        }

        #playlist {
            width: 90%;
            max-width: 800px;
            margin: 20px auto 40px;
        }

        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
            padding: 12px 16px;
            border-radius: 14px;
            background: rgba(255,255,255,0.12);
        }

        .song-name {
            font-size: 17px;
        }

        .song-item button {
            padding: 9px 15px;
            font-size: 14px;
        }

        .active {
            background: rgba(255,255,255,0.25);
        }

        @media (max-width: 600px) {

            .header h1 {
                font-size: 25px;
            }

            #liveTime {
                font-size: 23px;
            }

            #song-title {
                font-size: 20px;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🎵 MY MUSIC 🎵</h1>
    </div>

    <div class="date-time">
        <div id="liveDate"></div>
        <div id="liveTime"></div>
    </div>

    <div class="now-playing">

        <div id="song-title">
            🎵 Song 1
        </div>

        <audio id="audio" controls></audio>

        <div class="controls">
            <button onclick="previousSong()">⏮️ Previous</button>
            <button onclick="nextSong()">⏭️ Next</button>
        </div>

    </div>

    <div id="playlist"></div>


    <script>

        /* =========================
           35 SONGS
        ========================= */

        const songs = [];

        for (let i = 1; i <= 35; i++) {

            songs.push({
                title: "Song " + i,
                src: "song (" + i + ").mp3"
            });

        }


        /* =========================
           MUSIC PLAYER
        ========================= */

        let currentSong = 0;

        const audio = document.getElementById("audio");
        const title = document.getElementById("song-title");
        const playlist = document.getElementById("playlist");


        /* Song play function */

        function playSong(index) {

            currentSong = index;

            audio.src = songs[index].src;

            title.textContent = "🎵 " + songs[index].title;

            audio.play().catch(function(error) {
                console.log("पहले Play button दबाएँ:", error);
            });

            updatePlaylist();
        }


        /* =========================
           AUTOMATIC NEXT SONG
        ========================= */

        audio.addEventListener("ended", function() {

            currentSong++;

            /* आखिरी song के बाद फिर Song 1 */

            if (currentSong >= songs.length) {
                currentSong = 0;
            }

            playSong(currentSong);

        });


        /* =========================
           NEXT BUTTON
        ========================= */

        function nextSong() {

            currentSong++;

            if (currentSong >= songs.length) {
                currentSong = 0;
            }

            playSong(currentSong);
        }


        /* =========================
           PREVIOUS BUTTON
        ========================= */

        function previousSong() {

            currentSong--;

            if (currentSong < 0) {
                currentSong = songs.length - 1;
            }

            playSong(currentSong);
        }


        /* =========================
           CREATE PLAYLIST
        ========================= */

        function createPlaylist() {

            playlist.innerHTML = "";

            songs.forEach(function(song, index) {

                const item = document.createElement("div");

                item.className = "song-item";

                item.innerHTML = `
                    <span class="song-name">
                        🎵 ${song.title}
                    </span>

                    <button onclick="playSong(${index})">
                        ▶️ Play
                    </button>
                `;

                playlist.appendChild(item);

            });

        }


        /* =========================
           ACTIVE SONG
        ========================= */

        function updatePlaylist() {

            const items = document.querySelectorAll(".song-item");

            items.forEach(function(item, index) {

                if (index === currentSong) {
                    item.classList.add("active");
                } else {
                    item.classList.remove("active");
                }

            });

        }


        /* =========================
           DATE & TIME
        ========================= */

        function updateDateTime() {

            const now = new Date();

            const date = now.toLocaleDateString("hi-IN", {
                day: "2-digit",
                month: "long",
                year: "numeric"
            });

            const time = now.toLocaleTimeString("hi-IN", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            });

            document.getElementById("liveDate").textContent = date;

            document.getElementById("liveTime").textContent = time;
        }


        /* =========================
           START WEBSITE
        ========================= */

        createPlaylist();

        updateDateTime();

        setInterval(updateDateTime, 1000);


        /* पहले Song को तैयार रखें */

        audio.src = songs[0].src;

        title.textContent = "🎵 " + songs[0].title;

        updatePlaylist();

    </script>

</body>

</html>
